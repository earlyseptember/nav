<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线白板</title>
<style>
  :root{
    --blue:#0F4C81; --blue2:#2563eb; --line:#e2e8f0; --bg:#f1f5f9;
    --bar:#ffffff; --muted:#64748b; --active:#e8f0fe;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;}

  /* ===== 工具栏 ===== */
  .toolbar{background:var(--bar);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;user-select:none;}
  .group{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);}
  .group:last-child{border-right:none;}
  .tb{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:#334155;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .tb:hover{background:var(--active);}
  .tb.active{background:var(--blue);color:#fff;}
  .tb .ic{font-size:16px;line-height:1;}
  .tb .lb{font-weight:600;}
  .sep{width:1px;height:22px;background:var(--line);}

  /* 颜色 */
  .swatches{display:flex;gap:5px;align-items:center;}
  .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--blue2);transform:scale(1.12);}
  .sw.white{background:#fff;}
  .sw.black{background:#1e293b;}
  .sw.red{background:#dc2626;}
  .sw.blue{background:#2563eb;}
  .sw.green{background:#16a34a;}
  .sw.orange{background:#ea580c;}
  .sw.purple{background:#7c3aed;}
  .sw.pink{background:#db2777;}
  .sw.yellow{background:#fde047;}

  /* 粗细 */
  .sizebar{display:flex;gap:4px;align-items:center;}
  .sizebtn{display:flex;align-items:center;justify-content:center;width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
  .sizebtn.on{border-color:var(--blue2);background:var(--active);}
  .sizebtn .dot{background:#334155;border-radius:999px;}
  .pageinfo{font-size:14px;color:#334155;min-width:44px;text-align:center;font-weight:600;}

  /* ===== 画布 ===== */
  .canvas-wrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}
  canvas.select-cursor{cursor:default;}
  #textInput{position:absolute;display:none;border:1.5px solid var(--blue2);border-radius:4px;padding:4px 8px;font-size:24px;min-width:80px;min-height:36px;background:#fff;color:#1e293b;resize:both;z-index:10;font-family:inherit;line-height:1.3;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.15);}
</style>
</head>
<body>

<div class="toolbar">
  <div class="group" id="toolGroup">
    <button class="tb active" data-tool="pen"><span class="ic">✏️</span><span class="lb">画笔</span></button>
    <button class="tb" data-tool="highlight"><span class="ic">🖍️</span><span class="lb">荧光笔</span></button>
    <button class="tb" data-tool="eraser"><span class="ic">🧽</span><span class="lb">橡皮</span></button>
    <button class="tb" data-tool="line"><span class="ic">╱</span><span class="lb">直线</span></button>
    <button class="tb" data-tool="arrow"><span class="ic">➜</span><span class="lb">箭头</span></button>
    <button class="tb" data-tool="rect"><span class="ic">▭</span><span class="lb">矩形</span></button>
    <button class="tb" data-tool="ellipse"><span class="ic">◯</span><span class="lb">椭圆</span></button>
    <button class="tb" data-tool="text"><span class="ic">T</span><span class="lb">文字</span></button>
    <button class="tb" data-tool="select"><span class="ic">⬚</span><span class="lb">选择</span></button>
  </div>

  <div class="group">
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="group">
    <div class="sizebar" id="sizebar">
      <button class="sizebtn" data-size="thin"><span class="dot" style="width:3px;height:3px;"></span></button>
      <button class="sizebtn on" data-size="med"><span class="dot" style="width:6px;height:6px;"></span></button>
      <button class="sizebtn" data-size="thick"><span class="dot" style="width:11px;height:11px;"></span></button>
    </div>
  </div>

  <div class="group">
    <button class="tb" data-bg="white"><span class="lb">白板</span></button>
    <button class="tb" data-bg="black"><span class="lb">黑板</span></button>
    <button class="tb" data-bg="ruled"><span class="lb">横线</span></button>
    <button class="tb" data-bg="grid"><span class="lb">方格</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnUndo"><span class="ic">↩️</span><span class="lb">撤销</span></button>
    <button class="tb" id="btnRedo"><span class="ic">↪️</span><span class="lb">重做</span></button>
    <button class="tb" id="btnClear"><span class="ic">🗑️</span><span class="lb">清空</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnPrev"><span class="lb">◀</span></button>
    <span class="pageinfo" id="pageLabel">1 / 1</span>
    <button class="tb" id="btnNext"><span class="lb">▶</span></button>
    <button class="tb" id="btnNewPage"><span class="ic">＋</span><span class="lb">新页</span></button>
    <button class="tb" id="btnDelPage"><span class="lb">删页</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnImportImage"><span class="ic">🖼️</span><span class="lb">导入图片</span></button>
    <button class="tb" id="btnExport"><span class="ic">💾</span><span class="lb">导出PNG</span></button>
    <button class="tb" id="btnExportSvg"><span class="ic">✒️</span><span class="lb">导出SVG</span></button>
    <button class="tb" id="btnFull"><span class="ic">⛶</span><span class="lb">全屏</span></button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="cv"></canvas>
  <textarea id="textInput" placeholder="输入文字"></textarea>
</div>

<script>
(function(){
  // ===== 状态 =====
  var tool = 'pen';
  var color = '#1e293b';
  var sizeKey = 'med';
  var pages = [{objects:[], bg:'white'}];
  var curPage = 0;
  var undoStack = [], redoStack = [];
  var selectedObjs = [];        // 选中对象数组（引用）
  var drawing = null;           // 正在绘制的临时对象
  var dragMode = null;          // 'stroke' | 'shape' | 'move' | 'select'
  var rubber = null;            // 框选矩形
  var moveInfo = null;          // 移动拖动信息
  var lastPt = null;

  var S_PEN={thin:3,med:6,thick:12};
  var S_HL={thin:16,med:24,thick:36};
  var S_ERASER={thin:18,med:32,thick:56};
  var S_TEXT={thin:16,med:24,thick:36};

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var wrap = document.getElementById('canvasWrap');
  var textInput = document.getElementById('textInput');

  function $(id){return document.getElementById(id);}

  // ===== 画布尺寸 =====
  function resize(){
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(wrap.clientWidth * dpr);
    cv.height = Math.round(wrap.clientHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    render();
  }
  window.addEventListener('resize', resize);

  // ===== 背景 =====
  function bgColor(bg){
    if(bg==='black') return '#1f2937';
    return '#ffffff';
  }
  function drawBackground(c, w, h, bg){
    c.fillStyle = bgColor(bg);
    c.fillRect(0,0,w,h);
    if(bg==='ruled'){
      c.strokeStyle='#cfe0ec'; c.lineWidth=1;
      for(var y=28;y<h;y+=28){ c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
    } else if(bg==='grid'){
      c.strokeStyle='#e2e8f0'; c.lineWidth=1;
      for(var x=28;x<w;x+=28){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,h); c.stroke(); }
      for(var yy=28;yy<h;yy+=28){ c.beginPath(); c.moveTo(0,yy); c.lineTo(w,yy); c.stroke(); }
    }
  }

  // ===== 对象绘制 =====
  function strokePath(c, obj){
    c.beginPath();
    var p=obj.points;
    c.moveTo(p[0].x,p[0].y);
    for(var i=1;i<p.length;i++) c.lineTo(p[i].x,p[i].y);
  }
  function drawObject(c, obj){
    c.save();
    if(obj.type==='stroke'){
      c.strokeStyle = obj.color;
      c.lineWidth = obj.width;
      c.lineCap='round'; c.lineJoin='round';
      if(obj.hl) c.globalAlpha = 0.32;
      strokePath(c, obj); c.stroke();
    } else if(obj.type==='line' || obj.type==='arrow'){
      c.strokeStyle = obj.color; c.lineWidth = obj.width; c.lineCap='round';
      c.beginPath(); c.moveTo(obj.x1,obj.y1); c.lineTo(obj.x2,obj.y2); c.stroke();
      if(obj.type==='arrow'){
        var ang=Math.atan2(obj.y2-obj.y1, obj.x2-obj.x1);
        var s=Math.max(10, obj.width*2.2);
        c.fillStyle=obj.color;
        c.beginPath();
        c.moveTo(obj.x2,obj.y2);
        c.lineTo(obj.x2-s*Math.cos(ang-0.42), obj.y2-s*Math.sin(ang-0.42));
        c.lineTo(obj.x2-s*Math.cos(ang+0.42), obj.y2-s*Math.sin(ang+0.42));
        c.closePath(); c.fill();
      }
    } else if(obj.type==='rect'){
      c.strokeStyle=obj.color; c.lineWidth=obj.width; c.lineJoin='round';
      var x=Math.min(obj.x1,obj.x2), y=Math.min(obj.y1,obj.y2);
      var w=Math.abs(obj.x2-obj.x1), h=Math.abs(obj.y2-obj.y1);
      c.strokeRect(x,y,w,h);
    } else if(obj.type==='ellipse'){
      c.strokeStyle=obj.color; c.lineWidth=obj.width;
      var cx=(obj.x1+obj.x2)/2, cy=(obj.y1+obj.y2)/2;
      var rx=Math.abs(obj.x2-obj.x1)/2, ry=Math.abs(obj.y2-obj.y1)/2;
      c.beginPath(); c.ellipse(cx,cy,Math.max(rx,0.5),Math.max(ry,0.5),0,0,Math.PI*2); c.stroke();
    } else if(obj.type==='text'){
      c.fillStyle=obj.color;
      c.font = '600 ' + obj.fontSize + 'px "Microsoft YaHei",sans-serif';
      c.textBaseline='top';
      var lines = obj.text.split('\n');
      for(var i=0;i<lines.length;i++) c.fillText(lines[i], obj.x, obj.y + i*obj.fontSize*1.3);
    } else if(obj.type==='image'){
      if(obj.img) c.drawImage(obj.img, obj.x, obj.y, obj.w, obj.h);
    }
    c.restore();
  }

  // ===== 选中框 =====
  function objBounds(obj){
    if(obj.type==='stroke'){
      var xs=obj.points.map(function(p){return p.x;}), ys=obj.points.map(function(p){return p.y;});
      return {x:Math.min.apply(null,xs), y:Math.min.apply(null,ys), x2:Math.max.apply(null,xs), y2:Math.max.apply(null,ys)};
    }
    if(obj.type==='text'){
      var w = obj.text.length * obj.fontSize * 0.62 + 8;
      var lines = obj.text.split('\n').length;
      return {x:obj.x, y:obj.y, x2:obj.x+w, y2:obj.y + lines*obj.fontSize*1.3};
    }
    if(obj.type==='image'){ return {x:obj.x, y:obj.y, x2:obj.x+obj.w, y2:obj.y+obj.h}; }
    return {x:Math.min(obj.x1,obj.x2), y:Math.min(obj.y1,obj.y2), x2:Math.max(obj.x1,obj.x2), y2:Math.max(obj.y1,obj.y2)};
  }
  function drawSelection(c){
    for(var i=0;i<selectedObjs.length;i++){
      var b=objBounds(selectedObjs[i]);
      c.save();
      c.strokeStyle='#2563eb'; c.lineWidth=1.5; c.setLineDash([6,4]);
      c.strokeRect(b.x-6,b.y-6,(b.x2-b.x)+12,(b.y2-b.y)+12);
      c.restore();
    }
    if(rubber){
      var x=Math.min(rubber.x0,rubber.x1), y=Math.min(rubber.y0,rubber.y1);
      var w=Math.abs(rubber.x1-rubber.x0), h=Math.abs(rubber.y1-rubber.y0);
      c.save(); c.fillStyle='rgba(37,99,235,0.08)'; c.strokeStyle='#2563eb'; c.lineWidth=1; c.setLineDash([4,4]);
      c.fillRect(x,y,w,h); c.strokeRect(x,y,w,h); c.restore();
    }
  }

  // ===== 渲染 =====
  function render(){
    var w = cv.width / (window.devicePixelRatio||1);
    var h = cv.height / (window.devicePixelRatio||1);
    drawBackground(ctx, w, h, pages[curPage].bg);
    var objs = pages[curPage].objects;
    for(var i=0;i<objs.length;i++) drawObject(ctx, objs[i]);
    if(drawing) drawObject(ctx, drawing);
    drawSelection(ctx);
  }

  // ===== 命中检测 =====
  function distToSeg(px,py,x1,y1,x2,y2){
    var dx=x2-x1, dy=y2-y1;
    var len2=dx*dx+dy*dy;
    var t = len2? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
    t = Math.max(0, Math.min(1, t));
    var cx=x1+t*dx, cy=y1+t*dy;
    return Math.hypot(px-cx, py-cy);
  }
  function hitTest(obj, x, y, tol){
    tol = tol || 8;
    if(obj.type==='stroke'){
      var p=obj.points;
      for(var i=0;i<p.length-1;i++){
        if(distToSeg(x,y,p[i].x,p[i].y,p[i+1].x,p[i+1].y) < tol + obj.width/2) return true;
      }
      if(p.length===1 && Math.hypot(x-p[0].x,y-p[0].y)<tol+obj.width/2) return true;
      return false;
    }
    if(obj.type==='line'||obj.type==='arrow'){
      return distToSeg(x,y,obj.x1,obj.y1,obj.x2,obj.y2) < tol + obj.width/2;
    }
    var b=objBounds(obj);
    return x>=b.x-tol && x<=b.x2+tol && y>=b.y-tol && y<=b.y2+tol;
  }
  function rectsOverlap(a, b){
    return !(a.x2<b.x || b.x2<a.x || a.y2<b.y || b.y2<a.y);
  }

  // ===== 撤销/重做 =====
  function snapshot(){
    return {page:curPage, objs: JSON.stringify(pages[curPage].objects)};
  }
  function pushUndo(){
    undoStack.push(snapshot());
    if(undoStack.length>120) undoStack.shift();
    redoStack.length=0;
  }
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshot());
    var s=undoStack.pop();
    curPage=s.page;
    pages[s.page].objects = JSON.parse(s.objs);
    selectedObjs=[]; render(); save(); updatePageLabel();
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshot());
    var s=redoStack.pop();
    curPage=s.page;
    pages[s.page].objects = JSON.parse(s.objs);
    selectedObjs=[]; render(); save(); updatePageLabel();
  }

  // ===== 保存/加载 =====
  function save(){
    try{
      var doc = {pages: pages.map(function(p){return {objects:p.objects.map(serializeObj), bg:p.bg};}), curPage:curPage};
      localStorage.setItem('whiteboard_doc_v1', JSON.stringify(doc));
    }catch(e){}
  }
  function serializeObj(o){
    if(o.type==='image'){
      var c=document.createElement('canvas'); c.width=o.w; c.height=o.h;
      c.getContext('2d').drawImage(o.img,0,0); 
      return {type:'image', x:o.x, y:o.y, w:o.w, h:o.h, data:c.toDataURL('image/png')};
    }
    return o;
  }
  function load(){
    try{
      var raw=localStorage.getItem('whiteboard_doc_v1');
      if(!raw) return;
      var doc=JSON.parse(raw);
      pages = doc.pages.map(function(p){
        return {objects: p.objects.map(function(o){
          if(o.type==='image' && o.data){
            var im=new Image();
            im.onload=function(){ if(doc.curPage< pages.length && pages[doc.curPage]) render(); };
            im.src=o.data;
            return {type:'image', x:o.x, y:o.y, w:o.w, h:o.h, img:im};
          }
          return o;
        }), bg:p.bg};
      });
      curPage = Math.min(doc.curPage||0, pages.length-1);
    }catch(e){}
  }

  // ===== 页管理 =====
  function updatePageLabel(){
    $('pageLabel').textContent = (curPage+1) + ' / ' + pages.length;
    var bgBtns=document.querySelectorAll('[data-bg]');
    for(var i=0;i<bgBtns.length;i++){
      bgBtns[i].classList.toggle('active', bgBtns[i].getAttribute('data-bg')===pages[curPage].bg);
    }
    render();
  }
  function gotoPage(i){
    if(i<0||i>=pages.length) return;
    curPage=i; selectedObjs=[]; updatePageLabel(); save();
  }
  function newPage(){
    pages.push({objects:[], bg: pages[curPage].bg});
    gotoPage(pages.length-1);
  }
  function delPage(){
    if(pages.length<=1){ return; }
    pages.splice(curPage,1);
    if(curPage>=pages.length) curPage=pages.length-1;
    selectedObjs=[]; updatePageLabel(); save();
  }
  function clearPage(){
    if(!pages[curPage].objects.length) return;
    pushUndo();
    pages[curPage].objects=[];
    selectedObjs=[]; render(); save();
  }

  // ===== 工具切换 =====
  function setTool(t){
    tool=t; selectedObjs=[]; drawing=null;
    var btns=document.querySelectorAll('#toolGroup .tb');
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tool')===t);
    cv.classList.toggle('select-cursor', t==='select');
    hideTextInput(false);
    render();
  }

  // ===== 颜色 / 粗细 / 背景 =====
  var COLORS=['#1e293b','#dc2626','#2563eb','#16a34a','#ea580c','#7c3aed','#db2777','#ffffff','#fde047'];
  function buildSwatches(){
    var el=$('swatches');
    COLORS.forEach(function(c){
      var d=document.createElement('div');
      d.className='sw';
      d.style.background=c;
      if(c==='#1e293b') d.classList.add('on');
      d.title=c;
      d.addEventListener('click', function(){
        color=c;
        document.querySelectorAll('#swatches .sw').forEach(function(s){s.classList.remove('on');});
        d.classList.add('on');
      });
      el.appendChild(d);
    });
  }
  function setSize(k){
    sizeKey=k;
    document.querySelectorAll('#sizebar .sizebtn').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-size')===k);
    });
  }
  function setBg(bg){
    pages[curPage].bg=bg;
    if(bg==='black' && (color==='#1e293b')) color='#ffffff';
    updatePageLabel(); save();
  }

  // ===== 指针事件 =====
  function getPos(e){
    var r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }
  function currentWidth(){
    if(tool==='highlight') return S_HL[sizeKey];
    if(tool==='eraser') return S_ERASER[sizeKey];
    return S_PEN[sizeKey];
  }

  cv.addEventListener('pointerdown', function(e){
    if(tool==='text'){ showTextInput(e); return; }
    cv.setPointerCapture(e.pointerId);
    var p=getPos(e);
    lastPt=p;

    if(tool==='select'){
      var hit=null;
      var objs=pages[curPage].objects;
      for(var i=objs.length-1;i>=0;i--){
        if(hitTest(objs[i],p.x,p.y)){ hit=objs[i]; break; }
      }
      if(hit){
        if(selectedObjs.indexOf(hit)<0){ selectedObjs=[hit]; pushUndo(); }
        else { pushUndo(); }
        moveInfo={startX:p.x, startY:p.y, starts:selectedObjs.map(function(o){return {x:o.x||o.x1, y:o.y||o.y1, x1:o.x1, y1:o.y1, x2:o.x2, y2:o.y2};})};
        dragMode='move';
      } else {
        selectedObjs=[]; dragMode='select';
        rubber={x0:p.x, y0:p.y, x1:p.x, y1:p.y};
      }
      render(); return;
    }

    // 绘画工具
    if(selectedObjs.length){ selectedObjs=[]; }
    if(tool==='pen'||tool==='highlight'||tool==='eraser'){
      drawing={type:'stroke', points:[p], color:(tool==='eraser'? bgColor(pages[curPage].bg):color), width:currentWidth(), hl:(tool==='highlight')};
      dragMode='stroke';
    } else {
      drawing={type:tool, x1:p.x, y1:p.y, x2:p.x, y2:p.y, color:color, width:S_PEN[sizeKey]};
      dragMode='shape';
    }
    render();
  });

  cv.addEventListener('pointermove', function(e){
    if(!dragMode) return;
    var p=getPos(e);
    if(dragMode==='stroke'){
      if(lastPt && Math.hypot(p.x-lastPt.x,p.y-lastPt.y)<1.5) return;
      drawing.points.push(p); lastPt=p; render();
    } else if(dragMode==='shape'){
      drawing.x2=p.x; drawing.y2=p.y; render();
    } else if(dragMode==='move'){
      var dx=p.x-moveInfo.startX, dy=p.y-moveInfo.startY;
      for(var i=0;i<selectedObjs.length;i++){
        var o=selectedObjs[i], s=moveInfo.starts[i];
        if(o.type==='line'||o.type==='arrow'||o.type==='rect'||o.type==='ellipse'){
          o.x1=s.x1+dx; o.y1=s.y1+dy; o.x2=s.x2+dx; o.y2=s.y2+dy;
        } else {
          o.x=s.x+dx; o.y=s.y+dy;
        }
      }
      render();
    } else if(dragMode==='select'){
      rubber.x1=p.x; rubber.y1=p.y; render();
    }
  });

  function finishStroke(){
    pushUndo();
    pages[curPage].objects.push(drawing);
    drawing=null; dragMode=null; lastPt=null;
    render(); save();
  }
  function finishShape(){
    if(Math.hypot(drawing.x2-drawing.x1, drawing.y2-drawing.y1)<2){ drawing=null; dragMode=null; render(); return; }
    pushUndo();
    pages[curPage].objects.push(drawing);
    drawing=null; dragMode=null; render(); save();
  }

  cv.addEventListener('pointerup', function(e){
    if(!dragMode) return;
    if(dragMode==='stroke'){ finishStroke(); }
    else if(dragMode==='shape'){ finishShape(); }
    else if(dragMode==='move'){
      dragMode=null; moveInfo=null; render(); save();
    } else if(dragMode==='select'){
      var x=Math.min(rubber.x0,rubber.x1), y=Math.min(rubber.y0,rubber.y1);
      var x2=Math.max(rubber.x0,rubber.x1), y2=Math.max(rubber.y0,rubber.y1);
      var box={x:x,y:y,x2:x2,y2:y2};
      selectedObjs=pages[curPage].objects.filter(function(o){return rectsOverlap(box, objBounds(o));});
      rubber=null; dragMode=null; render();
    }
  });

  cv.addEventListener('pointercancel', function(){
    if(dragMode==='stroke'){ finishStroke(); }
    else if(dragMode==='shape'){ finishShape(); }
    else { dragMode=null; moveInfo=null; rubber=null; render(); }
  });

  // ===== 文字输入 =====
  function showTextInput(e){
    var p=getPos(e);
    textInput.style.display='block';
    textInput.style.left=p.x+'px';
    textInput.style.top=p.y+'px';
    textInput.style.fontSize=S_TEXT[sizeKey]+'px';
    textInput.style.color=color;
    textInput.value='';
    textInput.focus();
  }
  function hideTextInput(commit){
    if(commit && textInput.value.trim()){
      pushUndo();
      var r=cv.getBoundingClientRect();
      var x=textInput.offsetLeft, y=textInput.offsetTop;
      pages[curPage].objects.push({type:'text', x:x, y:y, text:textInput.value, color:color, fontSize:S_TEXT[sizeKey]});
      render(); save();
    }
    textInput.style.display='none';
    textInput.value='';
  }
  textInput.addEventListener('blur', function(){ hideTextInput(true); });
  textInput.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ e.preventDefault(); hideTextInput(false); }
    else if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); hideTextInput(true); }
  });

  // ===== 插入图片（公共） =====
  function insertImage(im){
    var maxW=wrap.clientWidth*0.7, maxH=wrap.clientHeight*0.7;
    var r=Math.min(maxW/im.width, maxH/im.height, 1);
    var w=Math.round(im.width*r), h=Math.round(im.height*r);
    var x=Math.round((wrap.clientWidth-w)/2), y=Math.round((wrap.clientHeight-h)/2);
    pushUndo();
    pages[curPage].objects.push({type:'image', x:x, y:y, w:w, h:h, img:im});
    render(); save();
  }
  function loadImageFromFile(file, cb){
    var reader=new FileReader();
    reader.onload=function(ev){
      var im=new Image();
      im.onload=function(){ cb(im); };
      im.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ===== 图片粘贴（Ctrl+V） =====
  document.addEventListener('paste', function(e){
    var items=e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')===0){
        loadImageFromFile(items[i].getAsFile(), insertImage);
      }
    }
  });

  // ===== 图片导入（本地文件） =====
  var fileInput=document.getElementById('fileInput');
  $('btnImportImage').addEventListener('click', function(){ fileInput.value=''; fileInput.click(); });
  fileInput.addEventListener('change', function(){
    if(!fileInput.files.length) return;
    for(var i=0;i<fileInput.files.length;i++){
      loadImageFromFile(fileInput.files[i], insertImage);
    }
  });

  // ===== 键盘 =====
  document.addEventListener('keydown', function(e){
    if(document.activeElement===textInput) return;
    var k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.ctrlKey||e.metaKey) && k==='y'){ e.preventDefault(); redo(); return; }
    if((e.ctrlKey||e.metaKey) && k==='s'){ e.preventDefault(); exportPNG(); return; }
    if(e.key==='Delete'||e.key==='Backspace'){
      if(selectedObjs.length){ deleteSelected(); e.preventDefault(); }
      return;
    }
    if(k==='b'){ setTool('pen'); }
    else if(k==='h'){ setTool('highlight'); }
    else if(k==='e'){ setTool('eraser'); }
    else if(k==='l'){ setTool('line'); }
    else if(k==='a'){ setTool('arrow'); }
    else if(k==='r'){ setTool('rect'); }
    else if(k==='o'){ setTool('ellipse'); }
    else if(k==='t'){ setTool('text'); }
    else if(k==='v'){ setTool('select'); }
    else if(k==='f'){ toggleFullscreen(); }
  });
  function deleteSelected(){
    pushUndo();
    var objs=pages[curPage].objects;
    for(var i=0;i<selectedObjs.length;i++){
      var idx=objs.indexOf(selectedObjs[i]);
      if(idx>=0) objs.splice(idx,1);
    }
    selectedObjs=[]; render(); save();
  }

  // ===== 导出 =====
  function exportPNG(){
    var w=wrap.clientWidth, h=wrap.clientHeight;
    var scale=2;
    var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var cc=c.getContext('2d'); cc.scale(scale,scale);
    drawBackground(cc,w,h,pages[curPage].bg);
    var objs=pages[curPage].objects;
    for(var i=0;i<objs.length;i++) drawObject(cc, objs[i]);
    var a=document.createElement('a');
    var d=new Date();
    var pad=function(n){return n<10?'0'+n:''+n;};
    a.download='白板_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }

  function exportSVG(){
    var w=wrap.clientWidth, h=wrap.clientHeight;
    var bg=pages[curPage].bg;
    var parts=[];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">');
    parts.push('<rect width="100%" height="100%" fill="'+bgColor(bg)+'"/>');
    if(bg==='ruled'){
      for(var yy=28;yy<h;yy+=28) parts.push('<line x1="0" y1="'+yy+'" x2="'+w+'" y2="'+yy+'" stroke="#cfe0ec" stroke-width="1"/>');
    } else if(bg==='grid'){
      for(var xx=28;xx<w;xx+=28) parts.push('<line x1="'+xx+'" y1="0" x2="'+xx+'" y2="'+h+'" stroke="#e2e8f0" stroke-width="1"/>');
      for(var yyy=28;yyy<h;yyy+=28) parts.push('<line x1="0" y1="'+yyy+'" x2="'+w+'" y2="'+yyy+'" stroke="#e2e8f0" stroke-width="1"/>');
    }
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    var objs=pages[curPage].objects;
    for(var i=0;i<objs.length;i++){
      var o=objs[i];
      if(o.type==='stroke'){
        var pts=o.points.map(function(p){return p.x+','+p.y;}).join(' ');
        var op=o.hl?' opacity="0.32"':'';
        parts.push('<polyline points="'+pts+'" fill="none" stroke="'+o.color+'" stroke-width="'+o.width+'" stroke-linecap="round" stroke-linejoin="round"'+op+'/>');
      } else if(o.type==='line'){
        parts.push('<line x1="'+o.x1+'" y1="'+o.y1+'" x2="'+o.x2+'" y2="'+o.y2+'" stroke="'+o.color+'" stroke-width="'+o.width+'" stroke-linecap="round"/>');
      } else if(o.type==='arrow'){
        parts.push('<line x1="'+o.x1+'" y1="'+o.y1+'" x2="'+o.x2+'" y2="'+o.y2+'" stroke="'+o.color+'" stroke-width="'+o.width+'" stroke-linecap="round"/>');
        var ang=Math.atan2(o.y2-o.y1,o.x2-o.x1);
        var s=Math.max(10,o.width*2.2);
        var ax=o.x2-s*Math.cos(ang-0.42), ay=o.y2-s*Math.sin(ang-0.42);
        var bx=o.x2-s*Math.cos(ang+0.42), by=o.y2-s*Math.sin(ang+0.42);
        parts.push('<polygon points="'+o.x2+','+o.y2+' '+ax+','+ay+' '+bx+','+by+'" fill="'+o.color+'"/>');
      } else if(o.type==='rect'){
        var x=Math.min(o.x1,o.x2), y=Math.min(o.y1,o.y2);
        var rw=Math.abs(o.x2-o.x1), rh=Math.abs(o.y2-o.y1);
        parts.push('<rect x="'+x+'" y="'+y+'" width="'+rw+'" height="'+rh+'" fill="none" stroke="'+o.color+'" stroke-width="'+o.width+'" stroke-linejoin="round"/>');
      } else if(o.type==='ellipse'){
        var cx=(o.x1+o.x2)/2, cy=(o.y1+o.y2)/2;
        var rx=Math.abs(o.x2-o.x1)/2, ry=Math.abs(o.y2-o.y1)/2;
        parts.push('<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+o.color+'" stroke-width="'+o.width+'"/>');
      } else if(o.type==='text'){
        var lines=o.text.split('\n');
        var ts='<text x="'+o.x+'" y="'+o.y+'" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="'+o.fontSize+'" font-weight="600" fill="'+o.color+'">';
        for(var j=0;j<lines.length;j++){
          if(j===0) ts+=esc(lines[j]);
          else ts+='<tspan x="'+o.x+'" dy="'+Math.round(o.fontSize*1.3)+'">'+esc(lines[j])+'</tspan>';
        }
        ts+='</text>';
        parts.push(ts);
      } else if(o.type==='image'){
        var src = o.img ? esc(o.img.src) : '';
        parts.push('<image x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" xlink:href="'+src+'" href="'+src+'"/>');
      }
    }
    parts.push('</svg>');
    var svg=parts.join('');
    var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var d=new Date();
    var pad=function(n){return n<10?'0'+n:''+n;};
    a.download='白板_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())+'.svg';
    a.href=url;
    a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }

  // ===== 全屏 =====
  function toggleFullscreen(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen().catch(function(){}); }
  }
  document.addEventListener('fullscreenchange', function(){
    var tb=document.querySelector('.toolbar');
    if(document.fullscreenElement){ tb.style.display='none'; }
    else { tb.style.display=''; }
  });

  // ===== 绑定按钮 =====
  document.querySelectorAll('#toolGroup .tb').forEach(function(b){
    b.addEventListener('click', function(){ setTool(b.getAttribute('data-tool')); });
  });
  document.querySelectorAll('#sizebar .sizebtn').forEach(function(b){
    b.addEventListener('click', function(){ setSize(b.getAttribute('data-size')); });
  });
  document.querySelectorAll('[data-bg]').forEach(function(b){
    b.addEventListener('click', function(){ setBg(b.getAttribute('data-bg')); });
  });
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  $('btnClear').addEventListener('click', clearPage);
  $('btnPrev').addEventListener('click', function(){ gotoPage(curPage-1); });
  $('btnNext').addEventListener('click', function(){ gotoPage(curPage+1); });
  $('btnNewPage').addEventListener('click', newPage);
  $('btnDelPage').addEventListener('click', delPage);
  $('btnExport').addEventListener('click', exportPNG);
  $('btnExportSvg').addEventListener('click', exportSVG);
  $('btnFull').addEventListener('click', toggleFullscreen);

  // ===== 初始化 =====
  buildSwatches();
  load();
  resize();
  updatePageLabel();
})();
</script>
</body>
</html>
