<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线拼图</title>
<style>
  :root{
    --blue:#0F4C81; --blue2:#2563eb; --line:#e2e8f0; --bg:#f1f5f9;
    --panel:#fff; --text:#1e293b; --muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .wrap{max-width:1120px;margin:0 auto;padding:16px;}

  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:#f8fafc;}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn.primary:hover{background:var(--blue2);}
  .count{font-size:13px;color:var(--muted);margin-left:auto;}

  .main{display:flex;gap:16px;align-items:flex-start;}
  .preview{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:center;position:relative;min-height:420px;}
  .preview canvas{max-width:100%;max-height:72vh;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:4px;}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;pointer-events:none;}
  .placeholder .ic{font-size:40px;}
  .placeholder p{font-size:14px;}

  .side{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .card h3{font-size:14px;color:var(--blue);margin-bottom:10px;font-weight:700;}
  .card h3 .tip{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px;}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .row label{font-size:13px;color:#334155;width:52px;flex-shrink:0;}
  .row input[type=range]{flex:1;}
  .row .val{font-size:12px;color:var(--muted);width:38px;text-align:right;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#334155;font-size:13px;cursor:pointer;font-family:inherit;}
  .seg button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .swatches{display:flex;flex-wrap:wrap;gap:6px;}
  .sw{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--blue2);}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:#334155;cursor:pointer;}

  .gridnum{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .gridnum button{padding:5px 0;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .gridnum button:hover{background:#f0f7ff;}
  .gridnum button.on{background:var(--blue);color:#fff;border-color:var(--blue);}

  .tpllist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tpl{position:relative;border:2px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;background:#fff;}
  .tpl canvas{display:block;width:100%;border-radius:4px;}
  .tpl.on{border-color:var(--blue2);background:#eef4ff;}
  .tpl .badge{position:absolute;top:2px;right:2px;font-size:10px;background:var(--blue);color:#fff;padding:1px 4px;border-radius:4px;line-height:1.4;}

  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:72px;}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:grab;flex-shrink:0;}
  .thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .thumb:hover{border-color:var(--blue2);}
  .thumb .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer;display:none;}
  .thumb:hover .del{display:block;}
  .thumb.dragging{opacity:.4;}

  @media(max-width:860px){
    .main{flex-direction:column;}
    .side{width:100%;flex-direction:row;flex-wrap:wrap;}
    .card{flex:1;min-width:200px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <button class="btn primary" id="btnAdd">🖼️ 添加图片</button>
    <button class="btn" id="btnShuffle">🔀 随机排序</button>
    <button class="btn" id="btnReset">↩️ 重置图片位置</button>
    <button class="btn" id="btnClear">🗑️ 清空</button>
    <span class="count" id="count">0 张图片 / 0 格</span>
  </div>

  <div class="main">
    <div class="preview" id="preview">
      <canvas id="cv"></canvas>
      <div class="placeholder" id="placeholder">
        <div class="ic">🖼️</div>
        <p>把图片拖进来，或点「添加图片」</p>
        <p style="font-size:12px">最多 25 张，全部本地处理，不上传</p>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <h3>格子数</h3>
        <div class="gridnum" id="gridnum"></div>
      </div>

      <div class="card">
        <h3>模板 <span class="tip" id="tplCount"></span></h3>
        <div class="tpllist" id="tpllist"></div>
      </div>

      <div class="card">
        <h3>画布比例</h3>
        <div class="seg" id="ratioSeg">
          <button data-ratio="1:1">1:1</button>
          <button data-ratio="4:5">4:5</button>
          <button data-ratio="3:4">3:4</button>
          <button data-ratio="9:16">9:16</button>
          <button data-ratio="4:3">4:3</button>
          <button data-ratio="16:9">16:9</button>
        </div>
      </div>

      <div class="card">
        <h3>排版</h3>
        <div class="row"><label>外边距</label><input type="range" id="marginR" min="0" max="10" step="0.5" value="2"><span class="val" id="marginV">2%</span></div>
        <div class="row"><label>间距</label><input type="range" id="gapR" min="0" max="10" step="0.5" value="1.5"><span class="val" id="gapV">1.5%</span></div>
        <div class="row"><label>圆角</label><input type="range" id="radiusR" min="0" max="20" step="1" value="2"><span class="val" id="radiusV">2%</span></div>
        <label class="check"><input type="checkbox" id="shadowChk"> 投影</label>
      </div>

      <div class="card">
        <h3>背景</h3>
        <div class="swatches" id="bgSwatches"></div>
      </div>

      <div class="card">
        <h3>导出</h3>
        <div class="row"><label>长边</label>
          <select id="sizeSel" style="flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:13px;">
            <option value="1080">1080 px</option>
            <option value="1500" selected>1500 px</option>
            <option value="2000">2000 px</option>
            <option value="3000">3000 px</option>
            <option value="4000">4000 px</option>
          </select>
        </div>
        <div class="seg" id="fmtSeg">
          <button data-fmt="png" class="on">PNG</button>
          <button data-fmt="jpg">JPG</button>
        </div>
        <button class="btn primary" id="btnExport" style="width:100%;margin-top:10px;justify-content:center;">⬇️ 导出图片</button>
      </div>
    </div>
  </div>

  <div class="thumbs" id="thumbs"></div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

<script>
(function(){
  var DATA = window.COLLAGE_DATA;

  var images = [];
  var gridCount = 0;
  var autoGrid = true;
  var slots = [];         // {imgIdx, ox, oy, zoom}
  var templates = [];     // DATA.tpl[N] 的模板数组
  var curTpl = 0;

  var ratio = '1:1';
  var margin = 2, gap = 1.5, radius = 2;
  var shadowOn = false;
  var bg = '#ffffff';
  var exportSize = 1500;
  var format = 'png';
  var selected = -1;
  var dragInfo = null;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var preview = document.getElementById('preview');
  var MAX = 25;

  function $(id){return document.getElementById(id);}
  function ratioNum(){ var p=ratio.split(':'); return p[0]/p[1]; }

  function getTemplates(N){ return DATA.tpl[String(N)] || []; }

  // ===== 几何 =====
  function layout(W, H){
    var short = Math.min(W, H);
    var mpx = margin/100*short;
    var halfGap = gap/100*short/2;
    var rpx = radius/100*short*0.5;
    return {mpx:mpx, cw0:W-2*mpx, ch0:H-2*mpx, halfGap:halfGap, rpx:rpx};
  }
  function bbox(pts){
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for(var i=0;i<pts.length;i++){
      if(pts[i][0]<minX)minX=pts[i][0];
      if(pts[i][1]<minY)minY=pts[i][1];
      if(pts[i][0]>maxX)maxX=pts[i][0];
      if(pts[i][1]>maxY)maxY=pts[i][1];
    }
    return {x:minX,y:minY,w:maxX-minX,h:maxY-minY};
  }
  function roundRectPath(p,x,y,w,h,r){
    r=Math.max(0,Math.min(r,w/2,h/2));
    p.moveTo(x+r,y);
    p.arcTo(x+w,y,x+w,y+h,r);
    p.arcTo(x+w,y+h,x,y+h,r);
    p.arcTo(x,y+h,x,y,r);
    p.arcTo(x,y,x+w,y,r);
    p.closePath();
    return p;
  }
  function polygonPath2D(pts){
    var p=new Path2D();
    if(!pts.length) return p;
    p.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++) p.lineTo(pts[i][0],pts[i][1]);
    p.closePath();
    return p;
  }
  function maskPath2D(m,bx,by,bw,bh){
    var src=new Path2D(m[3]);
    var out=new Path2D();
    out.addPath(src, {a:bw/m[0], b:0, c:0, d:bh/m[1], e:bx, f:by});
    return out;
  }
  function shrinkPoly(pts, inset){
    if(inset<=0||pts.length<3) return pts;
    var bb=bbox(pts);
    var cx=bb.x+bb.w/2, cy=bb.y+bb.h/2;
    var sx=(bb.w-inset*2)/bb.w, sy=(bb.h-inset*2)/bb.h;
    if(sx<0.01)sx=0.01; if(sy<0.01)sy=0.01;
    return pts.map(function(p){ return [cx+(p[0]-cx)*sx, cy+(p[1]-cy)*sy]; });
  }
  function isRectPts(pts){
    if(pts.length!==4) return false;
    var e=0.6;
    return Math.abs(pts[0][1]-pts[1][1])<e && Math.abs(pts[1][0]-pts[2][0])<e &&
           Math.abs(pts[2][1]-pts[3][1])<e && Math.abs(pts[3][0]-pts[0][0])<e;
  }
  // 计算一个格子的裁剪路径 + 收缩后包围盒
  function getTileGeo(tile, L, W, H, roundOn){
    var f=tile[0], pts=[];
    for(var i=0;i<f.length;i+=2) pts.push([L.mpx+f[i]/100*L.cw0, L.mpx+f[i+1]/100*L.ch0]);
    var maskIdx=tile[1];
    var bb=bbox(pts);
    var path, rule='nonzero', isMask=false, isRect=false;
    var bx,by,bw,bh;
    if(maskIdx>=0){
      isMask=true;
      var m=DATA.masks[maskIdx];
      bx=bb.x+L.halfGap; by=bb.y+L.halfGap;
      bw=Math.max(1,bb.w-L.halfGap*2); bh=Math.max(1,bb.h-L.halfGap*2);
      path=maskPath2D(m,bx,by,bw,bh);
      rule=(m[2]===1)?'evenodd':'nonzero';
    } else if(isRectPts(pts)){
      isRect=true;
      bx=bb.x+L.halfGap; by=bb.y+L.halfGap;
      bw=Math.max(1,bb.w-L.halfGap*2); bh=Math.max(1,bb.h-L.halfGap*2);
      path=new Path2D();
      roundRectPath(path,bx,by,bw,bh, roundOn&&L.rpx>0?L.rpx:0);
    } else {
      var sp=shrinkPoly(pts,L.halfGap);
      var sb=bbox(sp);
      bx=sb.x; by=sb.y; bw=sb.w; bh=sb.h;
      path=polygonPath2D(sp);
    }
    return {path:path,rule:rule,isMask:isMask,isRect:isRect,bx:bx,by:by,bw:bw,bh:bh};
  }

  // ===== 重建 slots =====
  function rebuildSlots(){
    slots=[];
    for(var i=0;i<gridCount;i++){
      slots.push({imgIdx: images.length ? i%images.length : -1, ox:0, oy:0, zoom:1});
    }
  }
  function applyGridCount(N, auto){
    autoGrid = auto;
    gridCount = Math.max(0, Math.min(MAX, N));
    if(images.length && gridCount===0) gridCount = images.length;
    rebuildSlots();
    templates = getTemplates(gridCount);
    curTpl = 0; selected = -1;
    renderTplList(); updateGridnum(); draw();
  }

  function previewSize(){
    var r=ratioNum();
    if(r>=1) return {W:520, H:Math.round(520/r)};
    return {W:Math.round(520*r), H:520};
  }

  function render(c, W, H, guides){
    c.fillStyle = bg; c.fillRect(0,0,W,H);
    var tpl = templates[curTpl];
    if(!tpl) return;
    var L = layout(W,H);
    for(var i=0;i<tpl.t.length;i++){
      var geo = getTileGeo(tpl.t[i], L, W, H, tpl.r);
      var slot = slots[i];
      c.save();
      if(shadowOn && geo.isRect && !geo.isMask){
        c.shadowColor='rgba(0,0,0,0.25)'; c.shadowBlur=W*0.02; c.shadowOffsetY=W*0.008;
        c.fillStyle='#fff';
        c.fill(geo.path);
        c.shadowColor='transparent';
      }
      c.clip(geo.path, geo.rule);
      var img = (slot && slot.imgIdx>=0) ? images[slot.imgIdx].img : null;
      if(img && img.width){
        var minScale = Math.max(geo.bw/img.width, geo.bh/img.height);
        var scale = minScale*(slot.zoom||1);
        var dw=img.width*scale, dh=img.height*scale;
        var dx=(geo.bx+geo.bw/2)-dw/2+(slot.ox||0)*geo.bw;
        var dy=(geo.by+geo.bh/2)-dh/2+(slot.oy||0)*geo.bh;
        c.drawImage(img, dx, dy, dw, dh);
      } else {
        c.fillStyle='#eef2f7';
        c.fill(geo.path, geo.rule);
      }
      c.restore();

      if(guides){
        c.save();
        c.strokeStyle = (i===selected) ? '#2563eb' : 'rgba(255,255,255,0.75)';
        c.lineWidth = (i===selected) ? 3 : 1.5;
        c.stroke(geo.path);
        c.restore();
      }
    }
  }

  function draw(){
    var s=previewSize();
    cv.width=s.W; cv.height=s.H;
    render(ctx, s.W, s.H, true);
    $('placeholder').style.display = gridCount ? 'none' : 'flex';
    $('count').textContent = images.length + ' 张图片 / ' + gridCount + ' 格';
  }

  // ===== 格子数选择器 =====
  function buildGridnum(){
    var box=$('gridnum');
    for(var i=1;i<=MAX;i++){
      (function(n){
        var b=document.createElement('button');
        b.textContent=n;
        b.addEventListener('click', function(){ applyGridCount(n, false); });
        box.appendChild(b);
      })(i);
    }
  }
  function updateGridnum(){
    document.querySelectorAll('#gridnum button').forEach(function(b){
      b.classList.toggle('on', parseInt(b.textContent,10)===gridCount);
    });
  }

  // ===== 模板缩略图 =====
  function renderTplList(){
    var box=$('tpllist');
    box.innerHTML='';
    $('tplCount').textContent = templates.length ? (templates.length+' 个') : '';
    var r=ratioNum();
    templates.forEach(function(tpl, idx){
      var c=document.createElement('canvas');
      var s=88;
      var W,H;
      if(r>=1){ W=s; H=Math.round(s/r); } else { H=s; W=Math.round(s*r); }
      c.width=W; c.height=H;
      var cc=c.getContext('2d');
      cc.fillStyle='#f1f5f9'; cc.fillRect(0,0,W,H);
      var L={mpx:0, cw0:W, ch0:H, halfGap:0, rpx:0};
      tpl.t.forEach(function(tile, ti){
        var geo=getTileGeo(tile, L, W, H, false);
        cc.fillStyle=(ti%2)?'#a9c4de':'#9fbdd8';
        cc.fill(geo.path, geo.rule);
        cc.strokeStyle='rgba(255,255,255,0.9)';
        cc.lineWidth=1;
        cc.stroke(geo.path);
      });

      var d=document.createElement('div');
      d.className='tpl'+(idx===curTpl?' on':'');
      var isAb = tpl.a===1 || tpl.t.some(function(x){return x[0].length!==8;});
      if(isAb){
        var badge=document.createElement('span');
        badge.className='badge'; badge.textContent='异形';
        d.appendChild(badge);
      }
      d.appendChild(c);
      d.addEventListener('click', function(){
        curTpl=idx;
        document.querySelectorAll('#tpllist .tpl').forEach(function(x){x.classList.remove('on');});
        d.classList.add('on');
        draw();
      });
      box.appendChild(d);
    });
  }

  // ===== 上传 =====
  function addFiles(files){
    var arr=Array.prototype.slice.call(files).filter(function(f){return f.type.indexOf('image')===0;});
    var room=MAX-images.length;
    if(arr.length>room){ alert('最多 '+MAX+' 张，还能再添加 '+room+' 张'); arr=arr.slice(0,room); }
    var pending=arr.length;
    arr.forEach(function(file){
      var reader=new FileReader();
      reader.onload=function(ev){
        var im=new Image();
        im.onload=function(){
          images.push({img:im});
          pending--;
          if(pending===0){ afterImagesChange(); }
        };
        im.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function afterImagesChange(){
    if(autoGrid) gridCount = images.length;
    rebuildSlots();
    templates = getTemplates(gridCount);
    curTpl=0; selected=-1;
    renderTplList(); updateGridnum(); draw(); updateThumbs();
  }
  $('btnAdd').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(){ addFiles($('fileInput').files); $('fileInput').value=''; });
  preview.addEventListener('dragover', function(e){ e.preventDefault(); });
  preview.addEventListener('drop', function(e){
    e.preventDefault();
    if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ===== 画布交互 =====
  function evtPos(e){
    var r=cv.getBoundingClientRect(), s=previewSize();
    return {x:(e.clientX-r.left)*s.W/r.width, y:(e.clientY-r.top)*s.H/r.height};
  }
  function hitCell(p){
    var s=previewSize();
    var tpl=templates[curTpl];
    if(!tpl) return -1;
    var L=layout(s.W,s.H);
    for(var i=tpl.t.length-1;i>=0;i--){
      var geo=getTileGeo(tpl.t[i], L, s.W, s.H, tpl.r);
      if(p.x>=geo.bx && p.x<=geo.bx+geo.bw && p.y>=geo.by && p.y<=geo.by+geo.bh) return i;
    }
    return -1;
  }
  cv.addEventListener('pointerdown', function(e){
    var p=evtPos(e);
    var i=hitCell(p);
    selected=i; draw();
    if(i>=0){
      cv.setPointerCapture(e.pointerId);
      var tpl=templates[curTpl];
      var s=previewSize();
      var geo=getTileGeo(tpl.t[i], layout(s.W,s.H), s.W, s.H, tpl.r);
      dragInfo={idx:i, startX:p.x, startY:p.y, ox:slots[i].ox||0, oy:slots[i].oy||0, cw:geo.bw, ch:geo.bh};
    }
  });
  cv.addEventListener('pointermove', function(e){
    if(!dragInfo) return;
    var p=evtPos(e);
    var dx=p.x-dragInfo.startX, dy=p.y-dragInfo.startY;
    slots[dragInfo.idx].ox = dragInfo.ox + dx/dragInfo.cw;
    slots[dragInfo.idx].oy = dragInfo.oy + dy/dragInfo.ch;
    draw();
  });
  cv.addEventListener('pointerup', function(){ dragInfo=null; });
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var p=evtPos(e);
    var i=hitCell(p);
    if(i<0) return;
    var z=slots[i].zoom||1;
    z *= (e.deltaY<0)?1.1:1/1.1;
    z = Math.max(1, Math.min(5, z));
    slots[i].zoom=z; draw();
  }, {passive:false});
  cv.addEventListener('dblclick', function(e){
    var p=evtPos(e);
    var i=hitCell(p);
    if(i<0 || slots[i].imgIdx<0) return;
    var fi=$('fileInput');
    fi.value=''; fi.onchange=function(){
      if(fi.files.length) replaceImage(slots[i].imgIdx, fi.files[0]);
      fi.onchange=null;
    };
    fi.click();
  });
  function replaceImage(imgIdx, file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var im=new Image();
      im.onload=function(){ images[imgIdx]={img:im}; draw(); updateThumbs(); };
      im.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ===== 缩略图条 =====
  function updateThumbs(){
    var box=$('thumbs');
    box.innerHTML='';
    images.forEach(function(item, idx){
      var d=document.createElement('div');
      d.className='thumb'; d.draggable=true;
      var im=document.createElement('img');
      im.src=item.img.src;
      var del=document.createElement('div');
      del.className='del'; del.textContent='×';
      del.addEventListener('click', function(e){
        e.stopPropagation();
        images.splice(idx,1);
        slots.forEach(function(s){
          if(s.imgIdx===idx) s.imgIdx = images.length ? (idx%images.length) : -1;
          else if(s.imgIdx>idx) s.imgIdx--;
        });
        if(autoGrid) gridCount=images.length;
        rebuildSlots();
        templates=getTemplates(gridCount); curTpl=0; selected=-1;
        renderTplList(); updateGridnum(); draw(); updateThumbs();
      });
      d.appendChild(im); d.appendChild(del);
      d.addEventListener('dragstart', function(e){ d.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(idx)); });
      d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
      d.addEventListener('dragover', function(e){ e.preventDefault(); });
      d.addEventListener('drop', function(e){
        e.preventDefault();
        var from=parseInt(e.dataTransfer.getData('text/plain'),10);
        if(from===idx||isNaN(from)) return;
        var t=images[from]; images[from]=images[idx]; images[idx]=t;
        draw(); updateThumbs();
      });
      box.appendChild(d);
    });
  }

  // ===== 顶栏按钮 =====
  $('btnShuffle').addEventListener('click', function(){
    for(var i=images.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=images[i]; images[i]=images[j]; images[j]=t;
    }
    draw(); updateThumbs();
  });
  $('btnReset').addEventListener('click', function(){
    slots.forEach(function(s){ s.ox=0; s.oy=0; s.zoom=1; });
    draw();
  });
  $('btnClear').addEventListener('click', function(){
    images=[]; slots=[]; templates=[]; gridCount=0; autoGrid=true; curTpl=0; selected=-1;
    renderTplList(); updateGridnum(); draw(); updateThumbs();
  });

  // ===== 设置 =====
  document.querySelectorAll('#ratioSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#ratioSeg button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      ratio=b.getAttribute('data-ratio');
      renderTplList(); draw();
    });
  });
  function bindRange(id, valId, setter){
    $(id).addEventListener('input', function(){
      var v=parseFloat(this.value);
      setter(v);
      $(valId).textContent=v+'%';
      draw();
    });
  }
  bindRange('marginR','marginV', function(v){margin=v;});
  bindRange('gapR','gapV', function(v){gap=v;});
  bindRange('radiusR','radiusV', function(v){radius=v;});
  $('shadowChk').addEventListener('change', function(){ shadowOn=this.checked; draw(); });

  var BG_COLORS=['#ffffff','#1e293b','#f1f5f9','#f5f0e6','#fce7f3','#dbeafe','#d1fae5','#fef9c3'];
  function buildBg(){
    var el=$('bgSwatches');
    BG_COLORS.forEach(function(c){
      var d=document.createElement('div');
      d.className='sw'; d.style.background=c;
      if(c==='#ffffff') d.classList.add('on');
      d.addEventListener('click', function(){
        bg=c;
        document.querySelectorAll('#bgSwatches .sw').forEach(function(s){s.classList.remove('on');});
        d.classList.add('on');
        draw();
      });
      el.appendChild(d);
    });
  }
  $('sizeSel').addEventListener('change', function(){ exportSize=parseInt(this.value,10); });
  document.querySelectorAll('#fmtSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#fmtSeg button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      format=b.getAttribute('data-fmt');
    });
  });

  // ===== 导出 =====
  $('btnExport').addEventListener('click', function(){
    if(!slots.length){ alert('请先添加图片'); return; }
    var r=ratioNum(), W, H;
    if(r>=1){ W=exportSize; H=Math.round(exportSize/r); }
    else { H=exportSize; W=Math.round(exportSize*r); }
    var c=document.createElement('canvas'); c.width=W; c.height=H;
    render(c.getContext('2d'), W, H, false);
    var mime=format==='jpg'?'image/jpeg':'image/png';
    var a=document.createElement('a');
    a.download='拼图_'+W+'x'+H+'.'+format;
    a.href=c.toDataURL(mime,0.92);
    a.click();
  });

  buildBg();
  buildGridnum();
  updateGridnum();
  renderTplList();
  draw();
})();
</script>
</body>
</html>
