<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线提词器</title>
<style>
  :root{
    --blue:#0F4C81; --blue2:#2563eb;
    --bg:#f1f5f9; --panel:#ffffff; --text:#1e293b; --muted:#64748b;
    --view-bg:#ffffff; --view-text:#1e293b; --guide:#2563eb; --line:#e2e8f0;
  }
  body.dark{
    --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
    --view-bg:#0b1220; --view-text:#e2e8f0; --guide:#60a5fa; --line:#334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;transition:background .2s;}

  /* 工具栏 */
  .toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;user-select:none;transition:background .2s;}
  .group{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);}
  .group:last-child{border-right:none;}
  .tb{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .tb:hover{background:var(--bg);}
  .tb.primary{background:var(--blue);color:#fff;}
  .tb.primary:hover{background:var(--blue2);}
  .tb .ic{font-size:15px;line-height:1;}
  .tb.on{background:var(--blue);color:#fff;}
  .val{min-width:40px;text-align:center;font-size:14px;font-weight:600;color:var(--text);}
  .lbl{font-size:13px;color:var(--muted);}
  select.script{font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);max-width:140px;font-family:inherit;}

  /* 提词显示区 */
  .view{flex:1;position:relative;overflow:hidden;background:var(--view-bg);transition:background .2s;}
  .scroll{position:absolute;top:0;left:0;right:0;bottom:0;}
  .scroll.mirror{transform:scaleX(-1);}
  .lines{position:absolute;left:0;right:0;padding:0 8%;white-space:pre-wrap;text-align:center;color:var(--view-text);line-height:1.65;transition:color .2s;}
  .guide{position:absolute;left:0;right:0;top:50%;height:0;border-top:2px dashed var(--guide);opacity:.45;pointer-events:none;}
  .progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line);}
  .progress i{display:block;height:100%;width:0;background:var(--guide);}

  /* 输入区 */
  .editor{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:background .2s;}
  .editor textarea{width:100%;height:120px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.6;font-family:inherit;color:var(--text);background:var(--view-bg);outline:none;}
  .editor textarea:focus{border-color:var(--blue2);}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;}

  @media(max-width:640px){ .lines{padding:0 5%;} }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <button class="tb primary" id="btnPlay"><span class="ic">▶</span><span class="lb">播放</span></button>
    <button class="tb" id="btnReset"><span class="ic">⏮</span><span class="lb">重置</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnSpeedDown"><span class="lb">−</span></button>
    <span class="val" id="speedVal">速度 4</span>
    <button class="tb" id="btnSpeedUp"><span class="lb">＋</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnFontDown"><span class="lb">A−</span></button>
    <span class="val" id="fontVal">字号 48</span>
    <button class="tb" id="btnFontUp"><span class="lb">A＋</span></button>
  </div>

  <div class="group">
    <button class="tb" id="btnMirror"><span class="ic">🪞</span><span class="lb">镜像</span></button>
    <button class="tb" id="btnTheme"><span class="ic">🌓</span><span class="lb">主题</span></button>
    <button class="tb" id="btnFull"><span class="ic">⛶</span><span class="lb">全屏</span></button>
  </div>

  <div class="group">
    <select class="script" id="scriptSel"></select>
    <button class="tb" id="btnSave"><span class="lb">存脚本</span></button>
    <button class="tb" id="btnLoad"><span class="lb">载入</span></button>
    <button class="tb" id="btnDel"><span class="lb">删</span></button>
  </div>
</div>

<div class="view" id="view">
  <div class="scroll" id="scroll">
    <div class="lines" id="lines"></div>
  </div>
  <div class="guide"></div>
  <div class="progress"><i id="progressBar"></i></div>
</div>

<div class="editor">
  <textarea id="scriptText" placeholder="把要说的话粘贴到这里，然后点「播放」开始滚动提词……"></textarea>
  <div class="hint">快捷键：空格 播放/暂停 · R 重置 · ↑↓ 调速 · +/− 字号 · M 镜像 · T 主题 · F 全屏 · Ctrl+Enter 播放</div>
</div>

<script>
(function(){
  var speed = 4;          // 1-10
  var fontSize = 48;      // 16-120
  var playing = false;
  var mirror = false;
  var scrollY = 0;
  var lastTs = 0;

  var view = document.getElementById('view');
  var scrollEl = document.getElementById('scroll');
  var linesEl = document.getElementById('lines');
  var progressBar = document.getElementById('progressBar');
  var textarea = document.getElementById('scriptText');
  var btnPlay = document.getElementById('btnPlay');

  function $(id){return document.getElementById(id);}

  function speedPx(){ return speed * 20; }   // 速度4 => 80px/s

  // ===== 渲染台词 =====
  function renderLines(){
    linesEl.style.fontSize = fontSize + 'px';
    linesEl.textContent = textarea.value;
  }
  function measureAndReset(){
    renderLines();
    scrollY = 0;
    linesEl.style.top = view.clientHeight + 'px';
    linesEl.style.transform = 'translateY(0)';
    updateProgress();
  }
  function maxScroll(){
    return view.clientHeight + linesEl.offsetHeight;
  }
  function applyScroll(){
    linesEl.style.transform = 'translateY(' + (-scrollY) + 'px)';
    updateProgress();
  }
  function updateProgress(){
    var m = maxScroll();
    var pct = m ? Math.max(0, Math.min(1, scrollY/m)) : 0;
    progressBar.style.width = (pct*100) + '%';
  }

  // ===== 播放控制 =====
  function updatePlayBtn(){
    btnPlay.querySelector('.ic').textContent = playing ? '⏸' : '▶';
    btnPlay.querySelector('.lb').textContent = playing ? '暂停' : '播放';
  }
  function play(){
    if(playing) return;
    if(!textarea.value.trim()){ textarea.focus(); return; }
    if(scrollY >= maxScroll() - 1){ measureAndReset(); }
    playing = true;
    lastTs = performance.now();
    updatePlayBtn();
    requestAnimationFrame(step);
  }
  function pause(){
    playing = false;
    updatePlayBtn();
  }
  function step(ts){
    if(!playing) return;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    scrollY += speedPx() * dt;
    if(scrollY >= maxScroll()){
      scrollY = maxScroll();
      applyScroll();
      playing = false;
      updatePlayBtn();
      return;
    }
    applyScroll();
    requestAnimationFrame(step);
  }
  function reset(){
    pause();
    measureAndReset();
  }

  // ===== 参数调节 =====
  function setSpeed(v){
    speed = Math.max(1, Math.min(10, v));
    $('speedVal').textContent = '速度 ' + speed;
  }
  function setFont(v){
    fontSize = Math.max(16, Math.min(120, v));
    $('fontVal').textContent = '字号 ' + fontSize;
    renderLines();
    if(!playing){ measureAndReset(); }
  }

  // ===== 镜像 / 主题 / 全屏 =====
  function toggleMirror(){
    mirror = !mirror;
    scrollEl.classList.toggle('mirror', mirror);
    $('btnMirror').classList.toggle('on', mirror);
  }
  function toggleTheme(){
    document.body.classList.toggle('dark');
  }
  function toggleFullscreen(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen().catch(function(){}); }
  }
  document.addEventListener('fullscreenchange', function(){
    var full = !!document.fullscreenElement;
    document.querySelector('.toolbar').style.display = full ? 'none' : '';
    document.querySelector('.editor').style.display = full ? 'none' : '';
    // 全屏变化后重新测量
    setTimeout(measureAndReset, 50);
  });

  // ===== 脚本管理 =====
  function loadScripts(){
    try{ return JSON.parse(localStorage.getItem('teleprompter_scripts')||'{}'); }
    catch(e){ return {}; }
  }
  function saveScripts(s){ localStorage.setItem('teleprompter_scripts', JSON.stringify(s)); }
  function refreshScriptSel(){
    var s = loadScripts();
    var sel = $('scriptSel');
    sel.innerHTML = '';
    var names = Object.keys(s);
    if(!names.length){
      var o=document.createElement('option'); o.textContent='（暂无脚本）'; o.value=''; sel.appendChild(o);
      return;
    }
    names.forEach(function(n){
      var o=document.createElement('option'); o.textContent=n; o.value=n; sel.appendChild(o);
    });
  }
  function saveScript(){
    var name = prompt('给这段台词起个名字：');
    if(name===null) return;
    name = name.trim();
    if(!name){ alert('名字不能为空'); return; }
    var s = loadScripts();
    s[name] = textarea.value;
    saveScripts(s);
    refreshScriptSel();
  }
  function loadScript(){
    var name = $('scriptSel').value;
    if(!name) return;
    var s = loadScripts();
    if(s[name]!==undefined){ textarea.value = s[name]; reset(); }
  }
  function delScript(){
    var name = $('scriptSel').value;
    if(!name) return;
    if(!confirm('删除脚本「'+name+'」？')) return;
    var s = loadScripts();
    delete s[name];
    saveScripts(s);
    refreshScriptSel();
  }

  // ===== 事件绑定 =====
  $('btnPlay').addEventListener('click', function(){ playing ? pause() : play(); });
  $('btnReset').addEventListener('click', reset);
  $('btnSpeedDown').addEventListener('click', function(){ setSpeed(speed-1); });
  $('btnSpeedUp').addEventListener('click', function(){ setSpeed(speed+1); });
  $('btnFontDown').addEventListener('click', function(){ setFont(fontSize-4); });
  $('btnFontUp').addEventListener('click', function(){ setFont(fontSize+4); });
  $('btnMirror').addEventListener('click', toggleMirror);
  $('btnTheme').addEventListener('click', toggleTheme);
  $('btnFull').addEventListener('click', toggleFullscreen);
  $('btnSave').addEventListener('click', saveScript);
  $('btnLoad').addEventListener('click', loadScript);
  $('btnDel').addEventListener('click', delScript);

  textarea.addEventListener('input', function(){
    // 自动存草稿
    try{ localStorage.setItem('teleprompter_draft', textarea.value); }catch(e){}
    if(!playing){ measureAndReset(); }
  });
  textarea.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); play(); }
  });

  // 全局快捷键
  document.addEventListener('keydown', function(e){
    if(document.activeElement===textarea) return;  // 编辑框内不拦截
    var k = e.key;
    if(k===' '){ e.preventDefault(); playing ? pause() : play(); }
    else if(k==='r'||k==='R'){ reset(); }
    else if(k==='ArrowUp'){ e.preventDefault(); setSpeed(speed+1); }
    else if(k==='ArrowDown'){ e.preventDefault(); setSpeed(speed-1); }
    else if(k==='+'||k==='='){ setFont(fontSize+4); }
    else if(k==='-'||k==='_'){ setFont(fontSize-4); }
    else if(k==='m'||k==='M'){ toggleMirror(); }
    else if(k==='t'||k==='T'){ toggleTheme(); }
    else if(k==='f'||k==='F'){ toggleFullscreen(); }
  });

  // ===== 初始化 =====
  var DEFAULT = '欢迎使用在线提词器！\n\n把要说的话粘贴到下方输入框，点「播放」开始滚动。\n\n按空格键随时暂停，按 R 键回到开头，\n按上下方向键调节滚动速度，按 +/− 调节字号。\n\n祝录制顺利！';
  try{
    var draft = localStorage.getItem('teleprompter_draft');
    textarea.value = (draft===null || draft==='') ? DEFAULT : draft;
  }catch(e){ textarea.value = DEFAULT; }

  refreshScriptSel();
  setSpeed(4);
  setFont(48);
  measureAndReset();
})();
</script>
</body>
</html>
