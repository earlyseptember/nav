<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF 工具箱 · 拆分与合成</title>
<style>
  :root{
    --blue:#0F4C81;--blue2:#2563eb;--blue-soft:#eef4fb;
    --bg:#f5f7fa;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:24px;color:var(--blue);margin-bottom:4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px;}

  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:2px solid var(--border);}
  .tab{padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;}
  .tab:hover{color:var(--blue);}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .panel{display:none;}
  .panel.active{display:block;}

  .drop{border:2px dashed var(--border);border-radius:14px;background:var(--card);padding:32px 20px;text-align:center;cursor:pointer;transition:.15s;}
  .drop:hover,.drop.drag{border-color:var(--blue2);background:var(--blue-soft);}
  .drop .big{font-size:40px;line-height:1;}
  .drop .t1{font-size:17px;font-weight:700;margin-top:8px;}
  .drop .t2{color:var(--muted);font-size:13px;margin-top:4px;}

  .btn{padding:10px 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:.15s;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#0a3a66;}
  .btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn-ghost:hover{background:var(--blue-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .filein{display:none;}
  .err{color:#dc2626;font-weight:600;margin-top:12px;display:none;}
  .hint{font-size:13px;color:var(--muted);margin-top:14px;}

  .info{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:16px;}
  .info-grid{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:8px;}
  .info-item{font-size:14px;color:#334155;}
  .info-item b{color:var(--blue);}
  .controls{display:none;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px;}
  .controls label{font-size:14px;color:#334155;font-weight:600;margin-right:6px;}
  .controls select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#fff;cursor:pointer;}
  .frames{display:none;margin-top:20px;}
  .frames-title{font-size:16px;font-weight:700;color:#334155;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .fcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .fcard canvas{width:100%;display:block;background:#fff;}
  .fmeta{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#334155;}
  .fmeta .no{font-weight:700;color:var(--blue);}
  .fmeta .dl{color:var(--blue2);cursor:pointer;font-weight:600;border:none;background:none;font-size:13px;}
  .fmeta .dl:hover{text-decoration:underline;}
  .fdelay{font-size:12px;color:var(--muted);padding:0 10px 8px;}

  .thumbs{display:none;margin-top:18px;}
  .thumbs-title{font-size:16px;font-weight:700;color:#334155;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
  .thumbs-title .ops{margin-left:auto;display:flex;gap:8px;}
  .thumb-list{display:flex;flex-wrap:wrap;gap:12px;}
  .thumb{position:relative;width:110px;}
  .thumb img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--border);display:block;background:#fff;}
  .thumb .idx{position:absolute;top:4px;left:4px;background:rgba(15,76,129,.85);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;}
  .thumb .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;font-size:12px;line-height:1;}
  .thumb .mv{display:flex;justify-content:center;gap:6px;margin-top:4px;}
  .thumb .mv button{border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;padding:2px 8px;color:#334155;}
  .thumb .mv button:hover{background:var(--blue-soft);border-color:var(--blue2);}
  .thumb .mv button:disabled{opacity:.35;cursor:not-allowed;}
  .settings{display:none;margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
  .settings-grid{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;}
  .set-item label{display:block;font-size:13px;color:#334155;font-weight:600;margin-bottom:4px;}
  .set-item input,.set-item select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;width:120px;background:#fff;}
  .result{display:none;margin-top:18px;}
  .result-title{font-size:16px;font-weight:700;color:#334155;margin-bottom:10px;}
  .preview{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;}
  .preview img{max-width:100%;border-radius:8px;background:#fff;}
  .preview .meta{font-size:13px;color:var(--muted);margin-top:10px;}
  .result .btns{display:flex;gap:10px;margin-top:12px;justify-content:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>GIF 工具箱</h1>
  <div class="sub">一个页面搞定 GIF 拆分与图片合成 GIF。数据全程本地处理，不上传。</div>

  <div class="tabs">
    <button class="tab active" data-panel="panelSplit">🔍 GIF 拆分</button>
    <button class="tab" data-panel="panelMake">🎬 图片合成 GIF</button>
  </div>

  <div class="panel active" id="panelSplit">
    <div class="drop" id="spDrop">
      <div class="big">🖼️</div>
      <div class="t1">拖拽 GIF 到这里，或点击选择文件</div>
      <div class="t2">支持直接 Ctrl+V 粘贴 GIF 图片</div>
    </div>
    <input type="file" id="spFileInput" accept="image/gif,.gif" class="filein">
    <div class="err" id="spErr"></div>
    <div class="info" id="spInfo">
      <div class="info-grid" id="spInfoGrid"></div>
    </div>
    <div class="controls" id="spControls">
      <span><label>缩放</label>
        <select id="spScaleSel">
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%（原始）</option>
          <option value="2">200%</option>
        </select>
      </span>
      <span><label>导出格式</label>
        <select id="spFmtSel">
          <option value="png" selected>PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </span>
      <button class="btn btn-primary" id="spBtnZip">打包下载全部（ZIP）</button>
      <button class="btn btn-ghost" id="spBtnClear">清空</button>
    </div>
    <div class="frames" id="spFrames">
      <div class="frames-title" id="spFramesTitle"></div>
      <div class="grid" id="spGrid"></div>
    </div>
    <div class="hint">提示：GIF 各帧可能只记录局部变化，本工具已按 GIF 规范（含帧间累积与处置方式）合成每帧的完整画面，所见即所得。</div>
  </div>

  <div class="panel" id="panelMake">
    <div class="drop" id="mkDrop">
      <div class="big">🎞️</div>
      <div class="t1">拖拽多张图片到这里，或点击选择（可多选）</div>
      <div class="t2">支持 jpg / png / webp / gif（取首帧）等常见格式</div>
    </div>
    <input type="file" id="mkFileInput" accept="image/*" multiple class="filein">
    <div class="err" id="mkErr"></div>
    <div class="thumbs" id="mkThumbs">
      <div class="thumbs-title">
        图片顺序（共 <span id="mkThumbCount">0</span> 张）
        <span class="ops">
          <button class="btn btn-ghost" id="mkBtnClear" style="padding:6px 14px;font-size:13px;">清空</button>
        </span>
      </div>
      <div class="thumb-list" id="mkThumbList"></div>
    </div>
    <div class="settings" id="mkSettings">
      <div class="settings-grid">
        <div class="set-item"><label>每帧延迟（毫秒）</label><input type="number" id="mkDelayInp" value="200" min="20" step="10"></div>
        <div class="set-item"><label>循环</label>
          <select id="mkLoopSel">
            <option value="0" selected>无限循环</option>
            <option value="-1">播放一次</option>
            <option value="2">循环 2 次</option>
            <option value="3">循环 3 次</option>
            <option value="5">循环 5 次</option>
          </select>
        </div>
        <div class="set-item"><label>输出宽度（px，0=原始）</label><input type="number" id="mkWidthInp" value="0" min="0" step="10"></div>
        <div class="set-item"><label>颜色数</label>
          <select id="mkColorsSel">
            <option value="256" selected>256 色（最细腻）</option>
            <option value="128">128 色</option>
            <option value="64">64 色（体积小）</option>
            <option value="32">32 色</option>
          </select>
        </div>
        <button class="btn btn-primary" id="mkBtnMake">生成 GIF</button>
      </div>
    </div>
    <div class="result" id="mkResult">
      <div class="result-title">预览与下载</div>
      <div class="preview">
        <img id="mkPreviewImg" alt="GIF 预览">
        <div class="meta" id="mkPreviewMeta"></div>
      </div>
      <div class="btns">
        <button class="btn btn-primary" id="mkBtnDownload">下载 GIF</button>
        <button class="btn btn-ghost" id="mkBtnRemake">重新设置</button>
      </div>
    </div>
    <div class="hint">提示：GIF 所有帧会统一为同一尺寸（以第一张图的宽高比为基准等比裁切），颜色数越少体积越小。</div>
  </div>
</div>

  function loadFile(file){
    showErr('');
    if(!/\.gif$/i.test(file.name) && file.type !== 'image/gif'){
      showErr('请选择 GIF 格式的文件（当前文件：' + file.name + '）');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        parseGIF(ev.target.result);
      }catch(ex){
        showErr('解析失败：' + ex.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ===== 解析 =====
  function parseGIF(ab){
    gif = gifuct.parseGIF(ab);
    frames = gifuct.decompressFrames(gif, true);
    if(!frames || !frames.length){ showErr('该 GIF 没有图像帧'); return; }
    W = gif.lsd.width; H = gif.lsd.height;
    composed = composeAll(frames);
    renderInfo();
    renderFrames();
    $('spInfo').style.display='block';
    $('spControls').style.display='flex';
    $('spFrames').style.display='block';
  }

  // 合成完整帧（处理透明累积 + disposal）
  function composeAll(fs){
    var canvas = new Uint8ClampedArray(W*H*4); // 全透明
    var last = null;
    var out = [];
    for(var i=0;i<fs.length;i++){
      var f = fs[i];
      drawPatch(canvas, f);
      out.push(canvas.slice());
      if(f.disposalType === 2){           // 恢复背景（透明）
        clearRect(canvas, f.dims);
      } else if(f.disposalType === 3){    // 恢复上一帧
        if(last) restoreRect(canvas, last, f.dims);
      }
      last = out[out.length-1];
    }
    return out;
  }
  function drawPatch(canvas, f){
    for(var y=0;y<f.dims.height;y++){
      for(var x=0;x<f.dims.width;x++){
        var dx=f.dims.left+x, dy=f.dims.top+y;
        if(dx<0||dy<0||dx>=W||dy>=H) continue;
        var si=(y*f.dims.width+x)*4, di=(dy*W+dx)*4;
        if(f.patch[si+3] > 0){
          canvas[di]=f.patch[si]; canvas[di+1]=f.patch[si+1];
          canvas[di+2]=f.patch[si+2]; canvas[di+3]=f.patch[si+3];
        }
      }
    }
  }
  function clearRect(canvas, dims){
    for(var y=0;y<dims.height;y++){
      for(var x=0;x<dims.width;x++){
        var dx=dims.left+x, dy=dims.top+y;
        if(dx<0||dy<0||dx>=W||dy>=H) continue;
        var di=(dy*W+dx)*4; canvas[di]=0; canvas[di+1]=0; canvas[di+2]=0; canvas[di+3]=0;
      }
    }
  }
  function restoreRect(canvas, src, dims){
    for(var y=0;y<dims.height;y++){
      for(var x=0;x<dims.width;x++){
        var dx=dims.left+x, dy=dims.top+y;
        if(dx<0||dy<0||dx>=W||dy>=H) continue;
        var di=(dy*W+dx)*4;
        canvas[di]=src[di]; canvas[di+1]=src[di+1]; canvas[di+2]=src[di+2]; canvas[di+3]=src[di+3];
      }
    }
  }

  function loopCount(){
    if(!gif || !gif.frames) return null;
    for(var i=0;i<gif.frames.length;i++){
      var a = gif.frames[i].application;
      if(a && a.id === 'NETSCAPE2.0' && a.blocks){
        var b = a.blocks;
        var n = (b['1']||0) + ((b['2']||0)<<8);
        return n;
      }
    }
    return null;
  }

  // ===== 渲染 =====
  function renderInfo(){
    var totalMs = 0;
    frames.forEach(function(f){ totalMs += (f.delay || 0); });
    var sec = (totalMs/1000).toFixed(2);
    var lc = loopCount();
    var loopText = (lc === null) ? '未知' : (lc === 0 ? '无限循环' : '循环 '+lc+' 次');
    var items = [
      ['尺寸', W + ' × ' + H],
      ['帧数', frames.length + ' 帧'],
      ['总时长', sec + ' 秒'],
      ['循环', loopText],
      ['平均帧延迟', Math.round(totalMs/frames.length) + ' ms']
    ];
    $('spInfoGrid').innerHTML = items.map(function(it){
      return '<div class="info-item"><b>'+it[0]+'：</b>'+it[1]+'</div>';
    }).join('');
  }

  function renderFrames(){
    $('spFramesTitle').textContent = '全部 ' + frames.length + ' 帧';
    var scale = parseFloat($('spScaleSel').value);
    var html = '';
    for(var i=0;i<frames.length;i++){
      var delay = frames[i].delay || 0;
      html += '<div class="fcard">'+
        '<canvas id="cv_'+i+'" width="'+Math.max(1,Math.round(W*scale))+'" height="'+Math.max(1,Math.round(H*scale))+'"></canvas>'+
        '<div class="fmeta"><span class="no">第 '+(i+1)+' 帧</span><button class="dl" data-i="'+i+'">下载</button></div>'+
        '<div class="fdelay">延迟 ' + delay + ' ms</div>'+
        '</div>';
    }
    $('spGrid').innerHTML = html;
    for(var j=0;j<frames.length;j++){
      drawThumb(j, scale);
    }
    // 下载按钮
    var btns = $('spGrid').querySelectorAll('.dl');
    for(var k=0;k<btns.length;k++){
      btns[k].addEventListener('click', function(){
        downloadFrame(parseInt(this.getAttribute('data-i'),10));
      });
    }
  }

  function frameToCanvas(idx, scale, whiteBg){
    var data = composed[idx];
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    var id = ctx.createImageData(W, H);
    id.data.set(data);
    if(whiteBg){
      // JPG 无透明，透明像素转白
      for(var p=0;p<id.data.length;p+=4){
        if(id.data[p+3] === 0){ id.data[p]=255; id.data[p+1]=255; id.data[p+2]=255; id.data[p+3]=255; }
      }
    }
    ctx.putImageData(id, 0, 0);
    if(scale !== 1){
      var c2 = document.createElement('canvas');
      c2.width = Math.max(1,Math.round(W*scale));
      c2.height = Math.max(1,Math.round(H*scale));
      var ctx2 = c2.getContext('2d');
      ctx2.imageSmoothingEnabled = true;
      ctx2.imageSmoothingQuality = 'high';
      ctx2.drawImage(c, 0, 0, c2.width, c2.height);
      return c2;
    }
    return c;
  }

  function drawThumb(idx, scale){
    var c = $('cv_'+idx);
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(frameToCanvas(idx, scale, true), 0, 0, c.width, c.height);
  }

  function downloadFrame(idx){
    var scale = parseFloat($('spScaleSel').value);
    var fmt = $('spFmtSel').value;
    var c = frameToCanvas(idx, scale, fmt==='jpg');
    var mime = fmt==='jpg' ? 'image/jpeg' : 'image/png';
    var ext = fmt==='jpg' ? 'jpg' : 'png';
    c.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'frame_' + pad(idx+1) + '.' + ext;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }, mime, 0.92);
  }

  function pad(n){ return (n<10?'0':'')+n; }

  // 打包下载
  $('spBtnZip').addEventListener('click', function(){
    var scale = parseFloat($('spScaleSel').value);
    var fmt = $('spFmtSel').value;
    var ext = fmt==='jpg' ? 'jpg' : 'png';
    var mime = fmt==='jpg' ? 'image/jpeg' : 'image/png';
    var zip = new JSZip();
    var done = 0;
    var btns = $('spBtnZip');
    btns.disabled = true;
    frames.forEach(function(f, i){
      var c = frameToCanvas(i, scale, fmt==='jpg');
      c.toBlob(function(blob){
        zip.file('frame_' + pad(i+1) + '.' + ext, blob);
        done++;
        if(done === frames.length){
          zip.generateAsync({type:'blob'}).then(function(zb){
            var a = document.createElement('a');
            a.href = URL.createObjectURL(zb);
            a.download = 'gif_frames.zip';
            a.click();
            btns.disabled = false;
            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
          });
        }
      }, mime, 0.92);
    });
  });

  $('spScaleSel').addEventListener('change', function(){ if(frames) renderFrames(); });
  $('spFmtSel').addEventListener('change', function(){ if(frames) renderFrames(); });

  $('spBtnClear').addEventListener('click', function(){
    gif = null; frames = null; composed = null;
    $('spInfo').style.display='none';
    $('spControls').style.display='none';
    $('spFrames').style.display='none';
    $('spGrid').innerHTML='';
    showErr('');
  });
})();

</script>
<script>

(function(){
  var images = [];   // [{img:HTMLImageElement, name}]
  var gifBlob = null;
  var gifUrl = null;

  function $(id){ return document.getElementById(id); }
  function showErr(msg){ var e=$('mkErr'); if(msg){ e.textContent=msg; e.style.display='block'; } else { e.style.display='none'; } }

  // ===== 上传 =====
  $('mkDrop').addEventListener('click', function(){ $('mkFileInput').click(); });
  $('mkFileInput').addEventListener('change', function(e){
    if(e.target.files.length){ addFiles(Array.prototype.slice.call(e.target.files)); }
    e.target.value='';
  });
  ['dragover','dragenter'].forEach(function(ev){
    $('mkDrop').addEventListener(ev, function(e){ e.preventDefault(); $('mkDrop').classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    $('mkDrop').addEventListener(ev, function(e){ e.preventDefault(); $('mkDrop').classList.remove('drag'); });
  });
  $('mkDrop').addEventListener('drop', function(e){
    var fs = e.dataTransfer.files;
    if(fs && fs.length) addFiles(Array.prototype.slice.call(fs));
  });

  function addFiles(files){
    showErr('');
    files.forEach(function(file){
      if(file.type.indexOf('image')!==0) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var im = new Image();
        im.onload = function(){
          images.push({img:im, name:file.name});
          renderThumbs();
        };
        im.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderThumbs(){
    if(!images.length){
      $('mkThumbs').style.display='none';
      $('mkSettings').style.display='none';
      $('mkResult').style.display='none';
      return;
    }
    $('mkThumbs').style.display='block';
    $('mkSettings').style.display='block';
    $('mkThumbCount').textContent = images.length;
    var html = '';
    images.forEach(function(im, i){
      html += '<div class="thumb">'+
        '<img src="'+im.img.src+'" alt="">'+
        '<span class="idx">'+(i+1)+'</span>'+
        '<button class="del" data-i="'+i+'">×</button>'+
        '<div class="mv">'+
          '<button data-i="'+i+'" data-d="-1"'+(i===0?' disabled':'')+'>←</button>'+
          '<button data-i="'+i+'" data-d="1"'+(i===images.length-1?' disabled':'')+'>→</button>'+
        '</div>'+
        '</div>';
    });
    $('mkThumbList').innerHTML = html;
    $('mkThumbList').querySelectorAll('.del').forEach(function(b){
      b.addEventListener('click', function(){ images.splice(parseInt(this.getAttribute('data-i'),10),1); renderThumbs(); });
    });
    $('mkThumbList').querySelectorAll('.mv button').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(this.getAttribute('data-i'),10);
        var d = parseInt(this.getAttribute('data-d'),10);
        var j = i+d;
        if(j<0||j>=images.length) return;
        var t = images[i]; images[i]=images[j]; images[j]=t;
        renderThumbs();
      });
    });
  }

  $('mkBtnClear').addEventListener('click', function(){ images=[]; renderThumbs(); showErr(''); });

  // ===== 合成 =====
  $('mkBtnMake').addEventListener('click', makeGIF);

  function makeGIF(){
    if(images.length < 2){ showErr('至少需要 2 张图片才能合成动图（当前 ' + images.length + ' 张）'); return; }
    showErr('');
    var btn = $('mkBtnMake');
    btn.disabled = true; btn.textContent = '生成中…';

    var delay = Math.max(20, parseInt($('mkDelayInp').value,10) || 200);
    var repeat = parseInt($('mkLoopSel').value,10);
    var colors = parseInt($('mkColorsSel').value,10) || 256;
    var outW = parseInt($('mkWidthInp').value,10) || 0;

    // 以第一张图为基准尺寸
    var base = images[0].img;
    var bw = base.naturalWidth, bh = base.naturalHeight;
    if(outW > 0){
      var r = outW / bw;
      bw = outW; bh = Math.max(1, Math.round(bh*r));
    }

    try{
      var enc = gifenc.GIFEncoder();
      // 逐帧（同步绘制）
      images.forEach(function(im, i){
        var c = document.createElement('canvas');
        c.width = bw; c.height = bh;
        var ctx = c.getContext('2d');
        // cover 等比裁切
        var iw = im.img.naturalWidth, ih = im.img.naturalHeight;
        var s = Math.max(bw/iw, bh/ih);
        var sw = bw/s, sh = bh/s;
        var sx = (iw-sw)/2, sy = (ih-sh)/2;
        ctx.drawImage(im.img, sx, sy, sw, sh, 0, 0, bw, bh);
        var id = ctx.getImageData(0,0,bw,bh).data;
        var pal = gifenc.quantize(id, colors);
        var idx = gifenc.applyPalette(id, pal);
        var opts = { palette: pal, delay: delay };
        if(i === 0){ opts.repeat = repeat; }   // 循环次数只在首帧写入
        enc.writeFrame(idx, bw, bh, opts);
      });
      enc.finish();
      var bytes = enc.bytes();
      gifBlob = new Blob([bytes], {type:'image/gif'});
      if(gifUrl) URL.revokeObjectURL(gifUrl);
      gifUrl = URL.createObjectURL(gifBlob);

      $('mkPreviewImg').src = gifUrl;
      $('mkPreviewMeta').textContent = '尺寸 ' + bw + ' × ' + bh + ' · ' + images.length + ' 帧 · ' + formatSize(gifBlob.size);
      $('mkResult').style.display = 'block';
      $('mkResult').scrollIntoView({behavior:'smooth', block:'center'});
    }catch(ex){
      showErr('生成失败：' + ex.message);
    }
    btn.disabled = false; btn.textContent = '生成 GIF';
  }

  function formatSize(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/1024/1024).toFixed(2) + ' MB';
  }

  $('mkBtnDownload').addEventListener('click', function(){
    if(!gifBlob) return;
    var a = document.createElement('a');
    a.href = gifUrl;
    a.download = '动画.gif';
    a.click();
  });
  $('mkBtnRemake').addEventListener('click', function(){
    $('mkResult').style.display='none';
    $('mkSettings').scrollIntoView({behavior:'smooth', block:'center'});
  });
})();

</script>
<script>
(function(){
  function switchTo(id){
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      if(tabs[i].getAttribute('data-panel')===id){ tabs[i].classList.add('active'); }
      else { tabs[i].classList.remove('active'); }
    }
    var panels = document.querySelectorAll('.panel');
    for(var j=0;j<panels.length;j++){
      if(panels[j].id===id){ panels[j].classList.add('active'); }
      else { panels[j].classList.remove('active'); }
    }
  }
  var tabs = document.querySelectorAll('.tab');
  for(var k=0;k<tabs.length;k++){
    tabs[k].addEventListener('click', function(){
      switchTo(this.getAttribute('data-panel'));
    });
  }
})();
</script>
</body>
