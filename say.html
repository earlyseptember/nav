<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人间清醒</title>
<style>
  :root{
    --main:#0F766E;
    --main2:#14B8A6;
    --soft:#E4F5F2;
    --bg:#F4F6FA;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E4E9F0;
    --accent:#F59E0B;
    --accent-soft:#FEF3E2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .container{width:100%;max-width:760px;text-align:center;}

  header{margin-bottom:26px;}
  header h1{font-size:26px;margin:0 0 4px;color:var(--main);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:10px;}
  header h1 .dot{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);}
  header p{margin:0;color:var(--muted);font-size:14px;}

  .quote-card{
    position:relative;padding:52px 44px 44px;margin:0 auto 26px;
    background:linear-gradient(150deg,#0B3D3A 0%,#0F766E 100%);
    border-radius:18px;box-shadow:0 8px 30px rgba(15,118,110,.28);color:#fff;text-align:center;
    overflow:hidden;
  }
  .quote-card::before{
    content:'\201C';position:absolute;top:4px;left:22px;
    font-size:120px;line-height:1;color:rgba(255,255,255,.12);font-family:Georgia,serif;
  }
  .quote-text{
    font-size:26px;font-weight:600;line-height:1.8;margin:0 0 22px;
    word-break:break-word;position:relative;z-index:1;
  }
  .quote-text.small{font-size:20px;line-height:1.75;}
  .quote-text.fade{animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .quote-tag{
    display:inline-block;position:relative;z-index:1;font-size:13px;font-weight:600;
    padding:4px 14px;border-radius:20px;background:rgba(255,255,255,.16);color:#D7F5EE;
  }

  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    font-size:16px;font-weight:600;padding:13px 30px;border-radius:10px;
    border:1px solid transparent;cursor:pointer;transition:all .15s ease;
    font-family:inherit;line-height:1;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--main);color:#fff;}
  .btn-primary:hover{background:var(--main2);}
  .btn-ghost{background:#fff;color:var(--main);border-color:var(--main);}
  .btn-ghost:hover{background:var(--soft);}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;
    margin-top:22px;font-size:14px;color:#334155;
  }
  .ctrl{display:flex;align-items:center;gap:8px;}
  .switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#CBD5E1;border-radius:22px;transition:.2s;}
  .slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--main2);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .ctrl select{font-size:14px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;font-family:inherit;}
  .status-tip{margin-top:10px;font-size:12px;color:var(--muted);min-height:16px;}

  .click-dot{
    position:fixed;width:16px;height:16px;border-radius:50%;
    background:rgba(20,184,166,.55);transform:translate(-50%,-50%);
    pointer-events:none;z-index:9999;
    animation:ping .6s ease-out forwards;
  }
  @keyframes ping{
    from{box-shadow:0 0 0 0 rgba(20,184,166,.45);opacity:1;}
    to{box-shadow:0 0 0 26px rgba(20,184,166,0);opacity:0;}
  }

  @media(max-width:560px){
    .quote-card{padding:44px 28px 36px;}
    .quote-text{font-size:22px;}
    .quote-text.small{font-size:18px;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="dot"></span>人间清醒</h1>
  </header>

  <div class="quote-card" id="card">
    <div class="quote-text" id="quoteText"></div>
    <span class="quote-tag" id="quoteTag"></span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnNext">↻ 换一句</button>
    <button class="btn btn-ghost" id="btnCopy">复制</button>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label class="switch"><input type="checkbox" id="autoToggle" checked><span class="slider"></span></label>
      <span>自动轮播</span>
    </div>
    <div class="ctrl">
      <span>间隔</span>
      <select id="intervalSel">
        <option value="5000">5 秒</option>
        <option value="10000" selected>10 秒</option>
        <option value="30000">30 秒</option>
      </select>
    </div>
    <div class="ctrl">
      <label class="switch"><input type="checkbox" id="wakeToggle" checked><span class="slider"></span></label>
      <span>防休眠</span>
    </div>
  </div>
  <div class="status-tip" id="statusTip"></div>
</div>

  var textEl = document.getElementById('quoteText');
  var tagEl = document.getElementById('quoteTag');
  var lastIdx = -1;

  function pick(){
    var idx;
    do{ idx = Math.floor(Math.random() * QUOTES.length); }
    while(idx === lastIdx && QUOTES.length > 1);
    lastIdx = idx;
    return QUOTES[idx];
  }

  function show(){
    var q = pick();
    textEl.textContent = q.t;
    tagEl.textContent = q.a;
    // 长句自动缩小字号，避免卡片过高
    if(q.t.length > 60){ textEl.classList.add('small'); }
    else{ textEl.classList.remove('small'); }
    textEl.classList.remove('fade');
    void textEl.offsetWidth;
    textEl.classList.add('fade');
  }

  document.getElementById('btnNext').addEventListener('click', show);
  document.getElementById('btnCopy').addEventListener('click', function(){
    var txt = textEl.textContent + ' （' + tagEl.textContent + '）';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        this.textContent = '已复制 ✓';
        var self = this;
        setTimeout(function(){ self.textContent = '复制'; }, 1200);
      }.bind(this)).catch(function(){ fallback(); });
    } else {
      fallback();
    }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      this.textContent = '已复制 ✓';
      var self = this;
      setTimeout(function(){ self.textContent = '复制'; }, 1200);
    }
  });

  // 自动轮播
  var autoTimer = null;
  function applyAuto(){
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
    if(document.getElementById('autoToggle').checked){
      var ms = parseInt(document.getElementById('intervalSel').value, 10);
      autoTimer = setInterval(show, ms);
    }
  }
  document.getElementById('autoToggle').addEventListener('change', applyAuto);
  document.getElementById('intervalSel').addEventListener('change', applyAuto);

  // 防休眠
  var wakeLock = null;
  function setTip(msg){ document.getElementById('statusTip').textContent = msg; }
  function releaseWake(){
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  }
  async function applyWake(){
    var on = document.getElementById('wakeToggle').checked;
    if(!on){ releaseWake(); setTip(''); return; }
    if(!('wakeLock' in navigator)){
      setTip('当前环境不支持防休眠（需用 Chrome/Edge 的 HTTPS 或 localhost 打开）');
      return;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      setTip('防休眠已开启');
      wakeLock.addEventListener('release', function(){
        wakeLock = null;
        if(document.getElementById('wakeToggle').checked){
          setTip('防休眠已释放（切后台/锁屏会自动释放，回到页面将自动恢复）');
        }
      });
    }catch(e){
      setTip('防休眠开启失败：' + e.message);
    }
  }
  document.getElementById('wakeToggle').addEventListener('change', applyWake);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && document.getElementById('wakeToggle').checked){ applyWake(); }
  });

  // 模拟点击波纹
  function simulateClick(){
    var dot = document.createElement('div');
    dot.className = 'click-dot';
    dot.style.left = (10 + Math.random()*80) + 'vw';
    dot.style.top = (10 + Math.random()*80) + 'vh';
    document.body.appendChild(dot);
    setTimeout(function(){ if(dot.parentNode) dot.parentNode.removeChild(dot); }, 650);
  }
  setInterval(simulateClick, 30000);

  show();
  applyAuto();
  applyWake();
</script>
