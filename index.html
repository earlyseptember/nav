<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码上出发</title>
<style>
  /* ============================================================
     主题系统：改下面 JS 里的 CURRENT_THEME 数字即可切换风格
     1 星空夜   2 日落暖   3 极光绿   4 墨黑金
     5 樱花粉   6 海洋蓝   7 中国红
     8 薄荷青   9 暗夜紫金   10 沙漠棕
     ============================================================ */

  /* 默认变量（会被主题覆盖）*/
  :root {
    --bg-top: #1a1033;
    --bg-mid: #2d1b4e;
    --bg-bottom: #7b5cc9;
    --text: #f0ecfa;
    --muted: rgba(240, 236, 250, 0.55);
    --pill: rgba(255, 255, 255, 0.08);
    --pill-border: rgba(255, 255, 255, 0.35);
    --pill-hover-bg: rgba(255, 255, 255, 0.88);
    --pill-hover-text: #3a2468;
    --title-shadow: rgba(0, 0, 0, 0.4);
    --divider: rgba(255, 255, 255, 0.30);
    --saying-color: rgba(240, 236, 250, 0.85);
    --ground: #0d0619;
    --star-color: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background .6s;
  }

  /* ===== 星空（纯 CSS，星星颜色跟随主题）===== */
  .stars, .stars2 {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 120px 90px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 220px 50px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 320px 140px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80px 180px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 280px 220px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 180px 260px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 380px 40px, var(--star-color) 50%, transparent 51%);
    background-size: 420px 300px;
    opacity: .9;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars2 {
    background-image:
      radial-gradient(1px 1px at 60px 60px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 160px 200px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 260px 120px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1px 1px at 360px 260px, var(--star-color) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30px 240px, var(--star-color) 50%, transparent 51%);
    background-size: 400px 320px;
    opacity: .7;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle {
    from { opacity: .5; }
    to   { opacity: 1; }
  }

  /* 山峦 + 树剪影（纯 SVG，颜色跟随主题）*/
  .mountain {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 20vh;
    min-height: 120px;
    z-index: 0;
    pointer-events: none;
  }
  .mountain .run {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
  }
  .mountain .part {
    display: block;
    filter: var(--sil-filter, none);
  }
  .mountain .dino {
    position: absolute;
    bottom: 0;
    left: calc(50% - clamp(200px, 30vw, 420px));
    height: clamp(60px, 14vh, 130px);
  }
  /* 三个字母小人：收紧间距 */
  .mountain .letters {
    position: absolute;
    bottom: 0;
    left: calc(50% + clamp(90px, 14vw, 200px));
    display: flex;
    align-items: flex-end;
    gap: clamp(2px, 1vw, 10px);
  }
  .mountain .r,
  .mountain .u,
  .mountain .n { height: clamp(48px, 11vh, 105px); }
  /* 中间名言：严格居中 */
  .mountain .mid-text {
    position: absolute;
    bottom: clamp(16px, 4vh, 44px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .mountain .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 12px;
    background: var(--ground);
  }

  /* ===== 主体：垂直水平居中，内容超高时自动增长 ===== */
  .hero {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px 180px;
  }

  .hero h1 {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 6px;
    text-shadow: 0 2px 24px var(--title-shadow);
  }

  .divider {
    width: 260px;
    max-width: 70vw;
    height: 1px;
    background: var(--divider);
    margin: 22px auto;
  }
  .hero .saying {
    font-size: 16px;
    color: var(--saying-color);
    letter-spacing: 2px;
  }

  /* 导航胶囊 */
  .nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    max-width: 760px;
    margin: 34px auto 0;
  }
  /* 导航中间的分割线（占满整行） */
  .nav .nav-sep {
    flex-basis: 100%;
    height: 1px;
    margin: 10px 0;
    background: var(--divider);
    opacity: 0.7;
  }
  .nav a {
    padding: 8px 22px;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    background: var(--pill);
    border: 1px solid var(--pill-border);
    border-radius: 20px;
    transition: background .2s, color .2s, transform .15s;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .nav a:hover {
    background: var(--pill-hover-bg);
    color: var(--pill-hover-text);
    font-weight: 600;
    transform: translateY(-2px);
  }

  /* 手机适配 */
  @media (max-width: 640px) {
    .hero h1 { font-size: 30px; letter-spacing: 4px; }
    .hero .saying { font-size: 13px; letter-spacing: 1px; padding: 0 10px; }
    .nav { gap: 10px; max-width: 100%; }
    .nav a { padding: 7px 16px; font-size: 13px; }
    /* 手机端隐藏底部剪影图案，仅保留居中文字 */
    .mountain .dino,
    .mountain .letters { display: none; }
    .mountain .mid-text {
      bottom: 14px;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .mountain .ground { height: 10px; }
  }
</style>
</head>
