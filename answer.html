<title>答案之书</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#17263a 0%,#0e1621 55%,#080d14 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
    color:#e6c98a;
    -webkit-user-select:none;user-select:none;
  }
  .scene{perspective:1500px;width:340px;height:500px;max-width:92vw;max-height:78vh;}
  .book{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.2,1);}
  .book.open{transform:rotateY(-180deg);}

  .face{
    position:absolute;inset:0;border-radius:18px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.35);
  }
  /* —— 封面 —— */
  .face.front{
    background:linear-gradient(160deg,#5a2a2a 0%,#6e3434 45%,#4a2121 100%);
    border:1px solid rgba(230,201,138,.35);
  }
  .face.front::before{
    content:"";position:absolute;left:16px;top:16px;right:16px;bottom:16px;
    border:1px solid rgba(230,201,138,.30);border-radius:12px;pointer-events:none;
  }
  .cover-mark{font-size:34px;color:#e6c98a;opacity:.9;letter-spacing:6px;margin-bottom:18px;}
  .cover-title{font-size:34px;font-weight:700;letter-spacing:10px;color:#f3ddb0;text-shadow:0 2px 8px rgba(0,0,0,.4);}
  .cover-sub{margin-top:14px;font-size:15px;color:#d9bd82;letter-spacing:2px;line-height:2;}
  .divider{width:44px;height:1px;background:rgba(230,201,138,.5);margin:22px auto;}
  .btn{
    cursor:pointer;border:none;border-radius:999px;font-size:16px;letter-spacing:2px;
    padding:13px 34px;transition:transform .15s,box-shadow .2s,background .2s;font-family:inherit;
  }
  .btn:active{transform:scale(.96);}
  .btn.gold{
    background:linear-gradient(135deg,#e6c98a,#c9a45c);color:#3a2412;font-weight:700;
    box-shadow:0 6px 18px rgba(230,201,138,.35);
  }
  .btn.gold:hover{box-shadow:0 8px 24px rgba(230,201,138,.5);}

  /* —— 答案页（背面） —— */
  .face.back{
    background:linear-gradient(160deg,#f7f1e3 0%,#efe6cf 100%);
    transform:rotateY(180deg);color:#3a2e1f;justify-content:center;
    padding:36px 30px;
  }
  .face.back::before{
    content:"";position:absolute;left:18px;top:18px;right:18px;bottom:18px;
    border:1px solid rgba(122,101,58,.25);border-radius:10px;pointer-events:none;
  }
  .answer-label{font-size:13px;letter-spacing:6px;color:#a98e5d;margin-bottom:26px;}
  .answer-text{
    font-size:32px;font-weight:700;line-height:1.6;color:#3a2e1f;
    letter-spacing:1px;max-width:100%;
  }
  .answer-text.fade{animation:rise .6s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .actions{margin-top:36px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .btn.ink{background:#3a2e1f;color:#f3ddb0;box-shadow:0 5px 14px rgba(0,0,0,.25);}
  .btn.ghost{background:transparent;color:#8a7548;border:1px solid rgba(138,117,72,.5);padding:11px 30px;}
  .btn.ghost:hover{color:#3a2e1f;border-color:#3a2e1f;}

  @media(max-width:480px){
    .scene{height:62vh;}
    .cover-title{font-size:29px;letter-spacing:8px;}
    .answer-text{font-size:27px;}
  }
</style>
</head>

      <div class="face front">
        <div class="cover-mark">❖</div>
        <h1 class="cover-title">答案之书</h1>
        <div class="divider"></div>
        <p class="cover-sub">心中默想一个问题<br>再轻轻翻开</p>
        <div style="height:26px"></div>
        <button class="btn gold" id="openBtn">翻开答案</button>
      </div>
      <div class="face back">
        <div class="answer-label">答 案</div>
        <div class="answer-text" id="answerText"></div>
        <div class="actions">
          <button class="btn ink" id="againBtn">再问一次</button>
          <button class="btn ghost" id="backBtn">回到封面</button>
        </div>
      </div>
    </div>
  </div>

  var book = document.getElementById('book');
  var answerText = document.getElementById('answerText');
  var lastIdx = -1;

  function pickAnswer(){
    var idx;
    do{ idx = Math.floor(Math.random() * ANSWERS.length); }
    while(idx === lastIdx && ANSWERS.length > 1);
    lastIdx = idx;
    return ANSWERS[idx];
  }

  function showAnswer(){
    answerText.textContent = pickAnswer();
    answerText.classList.remove('fade');
    void answerText.offsetWidth; // 重启动画
    answerText.classList.add('fade');
  }

  document.getElementById('openBtn').addEventListener('click', function(){
    showAnswer();
    book.classList.add('open');
  });
  document.getElementById('againBtn').addEventListener('click', showAnswer);
  document.getElementById('backBtn').addEventListener('click', function(){
    book.classList.remove('open');
  });
