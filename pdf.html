<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档阅读</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bar: #ffffff;
    --text: #1f2937;
    --muted: #8a94a6;
    --border: #e7eaf0;
    --accent: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶栏 */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .topbar .title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .back {
    flex: none;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: background .15s;
  }
  .topbar .back:hover { background: #eef4ff; }
  .topbar .hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* 预览区 */
  .viewer {
    flex: 1;
    min-height: 0;
  }
  .viewer iframe,
  .viewer embed {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  /* 空状态 */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    gap: 8px;
  }
  .empty .big { font-size: 40px; }

  /* 手机适配 */
  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; }
    .topbar .hint { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 返回</a>
    <span class="title" id="docTitle">文档阅读</span>
    <span class="hint" id="docHint"></span>
  </div>

  <div class="viewer" id="viewer"></div>

<script>
  /* ============================================================
     用法：
     - pdf.html                          → 默认打开 docs/001.pdf
     - pdf.html?file=docs/002.pdf        → 打开指定 PDF
     - pdf.html?file=docs/x.pdf&title=标题 → 打开并自定义标题
     以后加 PDF 不用改代码，直接改链接里的 file 参数即可
     ============================================================ */
  const params = new URLSearchParams(location.search);
  let file  = params.get('file')  || 'docs/001.pdf';
  const title = params.get('title') || '文档阅读';

  // 安全过滤：只允许正常文件名字符，防止网址参数注入
  if (!/^[A-Za-z0-9_\-./\u4e00-\u9fa5]+$/.test(file)) file = 'docs/001.pdf';

  const viewer = document.getElementById('viewer');
  const docTitle = document.getElementById('docTitle');
  const docHint = document.getElementById('docHint');

  docTitle.textContent = title;
  docHint.textContent = 'PDF 预览';
  viewer.innerHTML =
    `<embed src="${file}" type="application/pdf" width="100%" height="100%">`;
</script>
</body>
</html>
