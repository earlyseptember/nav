<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九月初</title>
<style>
  /* ============================================================
     《九月初》· 秋日金色系（与导航页同源风格：深色渐变 + 居中排版）
     ============================================================ */
  :root {
    --bg-top: #1a1206;
    --bg-mid: #3d2a10;
    --bg-bottom: #b07a2a;
    --text: #faf3e3;
    --muted: rgba(250, 243, 227, 0.55);
    --accent: #e9c46a;
    --accent-soft: rgba(233, 196, 106, 0.18);
    --divider: rgba(233, 196, 106, 0.35);
    --title-shadow: rgba(0, 0, 0, 0.45);
    --leaf: #e9c46a;
    --ground: #0c0802;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", "STSong", serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== 背景微尘（纯 CSS，替代导航页的星空）===== */
  .leaves, .leaves2 {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .leaves {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 120px 90px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 220px 50px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 320px 140px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80px 180px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 280px 220px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 180px 260px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 380px 40px, var(--leaf) 50%, transparent 51%);
    background-size: 420px 300px;
    opacity: .28;
    animation: drift 6s ease-in-out infinite alternate;
  }
  .leaves2 {
    background-image:
      radial-gradient(1px 1px at 60px 60px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 160px 200px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 260px 120px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1px 1px at 360px 260px, var(--leaf) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30px 240px, var(--leaf) 50%, transparent 51%);
    background-size: 400px 320px;
    opacity: .2;
    animation: drift 8s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift {
    from { opacity: .3; transform: translateY(0); }
    to   { opacity: .65; transform: translateY(-10px); }
  }

  /* ===== 底部麦田剪影（纯 SVG 波形，颜色跟随主题）===== */
  .field {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 30vh;
    min-height: 190px;
    z-index: 0;
    pointer-events: none;
  }
  /* 麦穗丛：底部错落排布 */
  .wheat-bush {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    height: 100%;
  }
  .wheat-bush img {
    position: absolute;
    bottom: 0;
    height: 100%;
    width: auto;
  }
  .field svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
  .field .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 14px;
    background: var(--ground);
  }
  .field .mid-text {
    position: absolute;
    bottom: clamp(18px, 4vh, 40px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    white-space: nowrap;
  }

  /* ===== 主体：垂直水平居中 ===== */
  .hero {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 24px 140px;
  }

  .hero h1 {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 10px;
    text-shadow: 0 2px 26px var(--title-shadow);
  }

  /* 飘落的枫叶（JS 随机散布）*/
  .maple {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-8vh) rotate(0deg); opacity: 0; }
    10%  { opacity: var(--op, .55); }
    90%  { opacity: var(--op, .55); }
    100% { transform: translateY(108vh) rotate(var(--spin, 360deg)); opacity: 0; }
  }

  .divider {
    width: 220px;
    max-width: 60vw;
    height: 1px;
    background: var(--divider);
    margin: 24px auto;
  }

  .poem {
    max-width: 560px;
    margin: 0 auto;
  }
  .stanza {
    margin-bottom: 26px;
    font-size: 17px;
    line-height: 2.05;
    letter-spacing: 1px;
  }
  .stanza p { margin: 1px 0; }

  /* ===== 底部标签 ===== */
  .badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 20px;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid var(--divider);
    backdrop-filter: blur(4px);
    letter-spacing: 2px;
  }

  .beian { display: none; }

  /* 手机适配 */
  @media (max-width: 640px) {
    .hero h1 { font-size: 30px; letter-spacing: 6px; }
    .stanza { font-size: 15.5px; line-height: 1.95; }
    .field { height: 12vh; }
    .field .mid-text { bottom: 16px; font-size: 12px; letter-spacing: 2px; }
    .field .ground { height: 10px; }
  }
</style>
</head>
<body>
  <div class="leaves"></div>
  <div class="leaves2"></div>

  <div class="field">
    <div class="wheat-bush">
      <img src="images/maisui.png" alt="" style="height: 78%; left: 46%; opacity: .8; transform: scaleX(1);">
      <img src="images/maisui.png" alt="" style="height: 100%; left: 58%; opacity: .9; transform: scaleX(-1);">
      <img src="images/maisui.png" alt="" style="height: 64%; left: 34%; opacity: .6; transform: scaleX(-1) rotate(-4deg);">
      <img src="images/maisui.png" alt="" style="height: 52%; left: 68%; opacity: .45; transform: scaleX(1) rotate(5deg);">
      <img src="images/maisui.png" alt="" style="height: 44%; left: 24%; opacity: .38; transform: scaleX(-1) rotate(-7deg);">
    </div>
    <div class="ground"></div>
  </div>

  <section class="hero">
    <h1>九月初</h1>
    <div class="divider"></div>

    <div class="poem">
      <div class="stanza">
        <p>也许你还记得书包里崭新的铅笔盒</p>
        <p>也许你还记得新课本油墨的清香</p>
        <p>也许你总在夏天的末尾数着日子</p>
        <p>盼着与你重逢在洒满阳光的课堂</p>
      </div>

      <div class="stanza">
        <p>梧桐叶还留恋着枝头</p>
        <p>操场铺满初秋的暖阳</p>
        <p>沉甸甸的稻穗低下头来</p>
        <p>背着行囊的我们，一路向前</p>
      </div>

      <div class="stanza">
        <p>也许是第一次松开妈妈的手</p>
        <p>也许是第无数次走上熟悉的讲台</p>
        <p>也许粉笔灰又落满了旧时光</p>
        <p>也许梦想正翻开新的一页等待</p>
      </div>

      <div class="stanza">
        <p>这样一个九月初，我们都曾走过</p>
        <p>跌倒过，奔跑过，也歌唱过</p>
        <p>把汗水种进秋天的人</p>
        <p>终会在落叶里收获金黄的承诺</p>
      </div>

      <div class="stanza">
        <p>轻轻地对自己说一声：</p>
        <p>九月你好，生活正重新开始</p>
        <p>所有的种子都不负季节</p>
        <p>就像每一个孩子，不负九月，不负晨曦……</p>
      </div>
    </div>
  </section>

  <p class="beian">九月初</p>

<script>
  // ===== 随机散布飘落的枫叶（参考真实枫叶三大裂+底部两小裂）=====
  const MAPLE = `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 5
             L26 10 L28.5 8 L27.5 14
             C30 15 33 14 35.5 12 L34.5 16.5 L38 16 L35 19 L38.5 22
             C36 22.5 33.5 22.5 31 22 L31 26 L34.5 27 L30.5 29 L32 33
             C28.5 31.5 26 30.5 24.6 29.5
             L24 33 L23.4 29.5
             C22 30.5 19.5 31.5 16 33 L17.5 29 L13.5 27 L17 26 L17 22
             C14.5 22.5 12 22.5 9.5 22 L13 19 L10 16 L13.5 16.5 L12.5 12
             C15 14 18 15 20.5 14 L19.5 8 L22 10 Z"
      fill="CURRENT" opacity="0.95"/>
    <g stroke="DARK" stroke-width="0.8" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M24 8 C24 15 24 22 24 29"/>
      <path d="M24 13 C20 15 17 17 13.5 17"/>
      <path d="M24 13 C28 15 31 17 34.5 17"/>
      <path d="M24 18 C20 20 17.5 21.5 16 24"/>
      <path d="M24 18 C28 20 30.5 21.5 32 24"/>
    </g>
    <path d="M24 30 C23.5 34 23.5 38 22.5 44" stroke="CURRENT" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </svg>`;

  const COLORS = [
    { fill: '#e2762c', dark: '#a94f14' },
    { fill: '#e89040', dark: '#b06018' },
    { fill: '#d96a22', dark: '#9e4a10' },
    { fill: '#ea8a35', dark: '#b25a15' },
    { fill: '#dd7f2e', dark: '#a55512' }
  ];

  function makeLeaves() {
    const container = document.body;
    const count = 14;
    for (let i = 0; i < count; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'maple';
      const size = 22 + Math.random() * 26;           // 22~48px
      const left = Math.random() * 100;               // 0~100%
      const dur = 10 + Math.random() * 10;            // 10~20s
      const delay = -Math.random() * 20;              // 负延迟，让叶子一开始就分布在各处
      const spin = 180 + Math.random() * 420;
      const op = 0.4 + Math.random() * 0.4;
      const c = COLORS[Math.floor(Math.random() * COLORS.length)];

      leaf.innerHTML = MAPLE.replace(/CURRENT/g, c.fill).replace(/DARK/g, c.dark);
      leaf.style.left = left + '%';
      leaf.style.width = size + 'px';
      leaf.style.height = size + 'px';
      leaf.style.setProperty('--spin', spin + 'deg');
      leaf.style.setProperty('--op', op.toFixed(2));
      leaf.style.animationDuration = dur + 's';
      leaf.style.animationDelay = delay + 's';

      container.appendChild(leaf);
    }
  }
  makeLeaves();
</script>
</body>
</html>
